<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Campus Debug</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem}
.box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);padding:1.5rem;margin-bottom:1rem;border-radius:8px}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}
button{background:#C9A84C;color:#000;border:none;padding:0.6rem 1.5rem;font-weight:700;cursor:pointer;border-radius:6px;margin:0.3rem}
pre{white-space:pre-wrap;word-break:break-all;font-size:0.8rem;margin-top:0.5rem}
h2{color:#C9A84C;margin-bottom:0.5rem}
</style>
</head>
<body>
<h1>🔍 Campus Debug Panel</h1>
<p style="color:rgba(255,255,255,0.5);margin-bottom:1.5rem">Diagnosing why applications don't appear in admin</p>

<div class="box">
  <h2>1. Supabase Connection</h2>
  <div id="conn-status">Checking...</div>
</div>

<div class="box">
  <h2>2. campus_applications table</h2>
  <button onclick="checkApps()">Check Table</button>
  <div id="apps-status"></div>
</div>

<div class="box">
  <h2>3. admin_notifications table</h2>
  <button onclick="checkNotifs()">Check Notifications</button>
  <div id="notif-status"></div>
</div>

<div class="box">
  <h2>4. Insert Test Application</h2>
  <button onclick="insertTest()">Insert Test Record</button>
  <div id="insert-status"></div>
</div>

<div class="box">
  <h2>5. Auth Status</h2>
  <button onclick="checkAuth()">Check Session</button>
  <div id="auth-status"></div>
</div>

<script>
const SUPABASE_URL  = "https://bscecjbgnjitlfmgwcic.supabase.co";
const SUPABASE_ANON = "sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// 1. Test connection
async function testConn() {
  const el = document.getElementById("conn-status");
  try {
    const { data, error } = await sb.from("campus_applications").select("count", {count:"exact",head:true});
    if (error) {
      el.innerHTML = `<span class="err">❌ Connection error: ${error.message} (code: ${error.code})</span>`;
    } else {
      el.innerHTML = `<span class="ok">✅ Connected! campus_applications row count: ${data}</span>`;
    }
  } catch(e) {
    el.innerHTML = `<span class="err">❌ Exception: ${e.message}</span>`;
  }
}

async function checkApps() {
  const el = document.getElementById("apps-status");
  el.innerHTML = "Loading...";
  try {
    const { data, error, count } = await sb.from("campus_applications")
      .select("*", {count:"exact"})
      .order("created_at", {ascending:false})
      .limit(5);
    
    if (error) {
      el.innerHTML = `<span class="err">❌ Error: ${error.message}<br>Code: ${error.code}<br>Details: ${error.details}<br>Hint: ${error.hint}</span>`;
    } else {
      el.innerHTML = `<span class="ok">✅ Found ${count} total records</span>
        <pre>${JSON.stringify(data, null, 2)}</pre>`;
    }
  } catch(e) {
    el.innerHTML = `<span class="err">❌ Exception: ${e.message}</span>`;
  }
}

async function checkNotifs() {
  const el = document.getElementById("notif-status");
  el.innerHTML = "Loading...";
  try {
    const { data, error } = await sb.from("admin_notifications")
      .select("*").order("created_at",{ascending:false}).limit(5);
    if (error) {
      el.innerHTML = `<span class="err">❌ Error: ${error.message} (${error.code})</span>`;
    } else {
      el.innerHTML = `<span class="ok">✅ ${data.length} notifications found</span>
        <pre>${JSON.stringify(data, null, 2)}</pre>`;
    }
  } catch(e) {
    el.innerHTML = `<span class="err">❌ Exception: ${e.message}</span>`;
  }
}

async function insertTest() {
  const el = document.getElementById("insert-status");
  el.innerHTML = "Inserting...";
  try {
    const { data, error } = await sb.from("campus_applications").insert({
      full_name: "Test Student Debug",
      email: "debug_test_" + Date.now() + "@test.com",
      phone: "+255700000000",
      whatsapp_number: "+255700000000",
      university_name: "Ardhi University",
      university_abbr: "ARU",
      region: "Dar es Salaam",
      year_of_study: "2",
      shop_name: "Debug Test Shop",
      category: "Electronics & Accessories",
      description: "This is a debug test record to verify the insert works correctly",
      status: "pending",
      submitted_at: new Date().toISOString()
    }).select();
    
    if (error) {
      el.innerHTML = `<span class="err">❌ Insert FAILED:<br>Message: ${error.message}<br>Code: ${error.code}<br>Details: ${error.details}<br>Hint: ${error.hint}</span>`;
    } else {
      el.innerHTML = `<span class="ok">✅ Insert SUCCESS! Record created:</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
    }
  } catch(e) {
    el.innerHTML = `<span class="err">❌ Exception: ${e.message}</span>`;
  }
}

async function checkAuth() {
  const el = document.getElementById("auth-status");
  const { data: { session } } = await sb.auth.getSession();
  el.innerHTML = session 
    ? `<span class="ok">✅ Logged in as: ${session.user.email}</span>`
    : `<span class="warn">⚠️ Not logged in (anon access)</span>`;
}

// Run connection test on load
testConn();
checkAuth();
</script>
</body>
</html>
