<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Login — Travex Mall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D1B3E;--gold:#C9A84C;--gold2:#F0C96B;--white:#fff;--offwhite:#F8F9FC;--gray:#6B7280;--lgray:#E5E7EB;--dark:#111827;--green:#059669;--red:#DC2626}
body{font-family:"Inter",sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column}
.bg-dots{position:fixed;inset:0;opacity:0.03;background-image:radial-gradient(rgba(255,255,255,0.8) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(201,168,76,0.08),transparent 60%);pointer-events:none}
.topbar{padding:1.5rem 5%;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.logo{font-size:1.2rem;font-weight:800;color:var(--white);text-decoration:none}
.logo span{color:var(--gold)}
.back-link{font-size:0.8rem;color:rgba(255,255,255,0.5);text-decoration:none}
.back-link:hover{color:var(--gold)}
.card-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;position:relative;z-index:2}
.card{background:var(--white);width:100%;max-width:420px;padding:2.5rem}
.card-icon{font-size:2.5rem;margin-bottom:1.2rem}
.card-title{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:0.3rem}
.card-sub{font-size:0.875rem;color:var(--gray);margin-bottom:2rem;line-height:1.6}
.form-group{margin-bottom:1.2rem}
.form-label{display:block;font-size:0.8rem;font-weight:600;color:var(--dark);margin-bottom:0.45rem}
.form-input{width:100%;padding:0.75rem 1rem;border:1.5px solid var(--lgray);font-family:"Inter",sans-serif;font-size:0.875rem;color:var(--dark);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--navy)}
.form-input::placeholder{color:#9CA3AF}
.pass-wrap{position:relative}
.pass-toggle{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray);font-size:0.78rem;font-family:"Inter",sans-serif}
.btn-login{width:100%;padding:0.875rem;background:var(--navy);color:var(--white);font-size:0.95rem;font-weight:700;border:none;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;margin-bottom:1rem}
.btn-login:hover{background:var(--blue,#1B3A6B)}
.btn-login:disabled{background:var(--lgray);cursor:not-allowed}
.divider{display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem}
.divider-line{flex:1;height:1px;background:var(--lgray)}
.divider-text{font-size:0.72rem;color:var(--gray)}
.btn-open{display:block;width:100%;padding:0.875rem;background:var(--gold);color:var(--navy);font-size:0.875rem;font-weight:700;text-align:center;text-decoration:none;transition:all 0.2s}
.btn-open:hover{background:var(--gold2)}
.alert{padding:0.75rem 1rem;font-size:0.85rem;margin-bottom:1rem;display:none}
.alert.show{display:block}
.alert-error{background:#FEE2E2;border:1px solid #FECACA;color:var(--red)}
.card-footer{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--lgray);text-align:center;font-size:0.78rem;color:var(--gray)}
.card-footer a{color:var(--navy);font-weight:600;text-decoration:none}
.page-footer{padding:1.5rem 5%;text-align:center;position:relative;z-index:2}
.page-footer p{font-size:0.72rem;color:rgba(255,255,255,0.2)}
</style>
</head>
<body>
<div class="bg-dots"></div>
<div class="bg-glow"></div>
<div class="topbar">
  <a href="index.html" class="logo">TRAVEX <span>MALL</span></a>
  <a href="index.html" class="back-link">← Marketplace</a>
</div>
<div class="card-wrap">
  <div class="card">
    <div class="card-icon">🏪</div>
    <div class="card-title">Seller Dashboard Login</div>
    <div class="card-sub">Enter your phone number and password you created when opening your store.</div>
    <div class="alert alert-error" id="errAlert"></div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input type="tel" class="form-input" id="phone" placeholder="+255 712 000 000" onkeypress="if(event.key==='Enter')login()">
    </div>
    <div class="form-group">
      <label class="form-label">Password (6 characters)</label>
      <div class="pass-wrap">
        <input type="password" class="form-input" id="password" placeholder="Your 6-character password" maxlength="6" onkeypress="if(event.key==='Enter')login()">
        <button class="pass-toggle" onclick="togglePass()">Show</button>
      </div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="login()">Login to My Dashboard →</button>
    <div class="divider"><div class="divider-line"></div><div class="divider-text">Don't have a store yet?</div><div class="divider-line"></div></div>
    <a href="open-store.html" class="btn-open">🏪 Open Your Store on Travex Mall</a>
    <div class="card-footer">
      <p>Need help? <a href="mailto:travexmall15@gmail.com">travexmall15@gmail.com</a> · <a href="https://wa.me/255651919915">+255 651 919 915</a></p>
    </div>
  </div>
</div>
<div class="page-footer"><p>© 2026 Travex Digital Group</p></div>
<script>
const SUPABASE_URL  = "https://bscecjbgnjitlfmgwcic.supabase.co";
const SUPABASE_ANON = "sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// Check if already logged in
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.replace("seller-dashboard.html");
});

async function login() {
  const phone = document.getElementById("phone").value.trim().replace(/\s/g,"");
  const pass  = document.getElementById("password").value;
  const btn   = document.getElementById("loginBtn");
  const err   = document.getElementById("errAlert");
  err.classList.remove("show");

  if (!phone || !pass) {
    err.textContent = "Please enter your phone number and password.";
    err.classList.add("show"); return;
  }

  btn.textContent = "Logging in...";
  btn.disabled = true;

  // Build email from phone (same as open-store)
  const phoneClean = phone.replace(/\D/g,"");
  const email = phoneClean + "@travexmall.app";

  const { error } = await sb.auth.signInWithPassword({ email, password: pass + "TRX!" });

  if (error) {
    err.textContent = "Incorrect phone number or password. Please check and try again.";
    err.classList.add("show");
    btn.textContent = "Login to My Dashboard →";
    btn.disabled = false;
    return;
  }

  btn.textContent = "Welcome! Loading dashboard...";
  window.location.replace("seller-dashboard.html");
}

function togglePass() {
  const inp = document.getElementById("password");
  const btn = document.querySelector(".pass-toggle");
  inp.type = inp.type === "password" ? "text" : "password";
  btn.textContent = inp.type === "password" ? "Show" : "Hide";
}
</script>
</body>
</html>
