<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Browse Retail Stores — Travex Mall</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --br:8px;
  --br-lg:12px;
  --br-pill:40px;--navy:#0B3D2E;--blue:#145A43;--gold:#D7C7A1;--white:#fff;--offwhite:#F8F9FC;--gray:#6B7280;--lgray:#E5E7EB;--dark:#111827;--green:#059669}
body{font-family:"DM Sans",sans-serif;background:var(--offwhite);color:var(--dark)}

/* NAV */
nav{background:var(--navy);padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-family:"Outfit","DM Sans",sans-serif;font-size:1rem;font-weight:900;color:#fff;text-decoration:none}
.nav-logo span{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-link{font-size:0.8rem;color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.2s}
.nav-link:hover{color:var(--gold)}
.nav-btn{background:var(--gold);color:var(--navy);padding:0.4rem 1rem;font-size:0.78rem;font-weight:700;text-decoration:none;transition:all 0.2s}
.nav-btn:hover{background:#E8D9B5}

/* PAGE HEADER */
.page-header{background:var(--navy);padding:3rem 5% 2rem;position:relative;overflow:hidden}
.page-header::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.ph-inner{max-width:1200px;margin:0 auto;position:relative;z-index:1}
.ph-tag{display:inline-flex;align-items:center;gap:0.4rem;padding:0.25rem 0.75rem;font-size:0.62rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.75rem}
.ph-tag-b2c{background:rgba(192,192,192,0.1);border:1px solid rgba(192,192,192,0.25);color:#D1D5DB}
.ph-tag-b2b{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);color:var(--gold)}
.ph-title{font-family:"Outfit","DM Sans",sans-serif;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900;color:#fff;margin-bottom:0.4rem}
.ph-sub{font-size:0.875rem;color:rgba(255,255,255,0.4);font-weight:300}

/* FILTER BAR */
.filter-bar{background:#fff;border-bottom:1px solid var(--lgray);padding:1rem 5%;position:sticky;top:64px;z-index:90}
.filter-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
.filter-select{padding:0.55rem 1rem;border:1.5px solid var(--lgray);font-family:"DM Sans",sans-serif;font-size:0.82rem;color:var(--dark);background:#fff;outline:none;cursor:pointer;transition:border-color 0.2s;min-width:150px}
.filter-select:focus{border-color:var(--navy)}
.filter-search{flex:1;min-width:200px;padding:0.55rem 1rem;border:1.5px solid var(--lgray);font-family:"DM Sans",sans-serif;font-size:0.82rem;color:var(--dark);outline:none;transition:border-color 0.2s}
.filter-search:focus{border-color:var(--navy)}
.filter-search::placeholder{color:var(--gray)}
.filter-count{font-size:0.78rem;color:var(--gray);white-space:nowrap;margin-left:auto}

/* STORES GRID */
.stores-wrap{max-width:1200px;margin:2rem auto;padding:0 5%}
.stores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}

/* STORE CARD */
.store-card{background:#fff;border:1px solid var(--lgray);overflow:hidden;transition:all 0.3s;cursor:pointer}
.store-card:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(0,0,0,0.1);border-color:rgba(13,27,62,0.2)}
.store-banner{height:140px;background:linear-gradient(135deg,var(--navy),var(--blue));position:relative;overflow:hidden}
.store-banner img{width:100%;height:100%;object-fit:cover}
.store-banner-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem}
.store-badge-overlay{position:absolute;top:0.75rem;right:0.75rem;padding:0.2rem 0.6rem;font-size:0.6rem;font-weight:800;letter-spacing:0.1em}
.badge-silver-overlay{background:rgba(0,0,0,0.6);color:#E5E7EB;backdrop-filter:blur(4px)}
.badge-gold-overlay{background:rgba(201,168,76,0.85);color:#111}

.store-info{padding:1.2rem}
.store-logo-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
.store-logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--lgray);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;background:var(--navy);color:#fff;flex-shrink:0}
.store-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.store-name{font-size:0.95rem;font-weight:800;color:var(--navy);line-height:1.2}
.store-meta{font-size:0.72rem;color:var(--gray);margin-top:0.15rem}
.store-desc{font-size:0.8rem;color:var(--gray);line-height:1.6;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* TOP PRODUCTS */
.top-products{border-top:1px solid var(--lgray);padding-top:0.85rem;margin-bottom:0.85rem}
.top-products-label{font-size:0.62rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem}
.product-list{display:flex;flex-direction:column;gap:0.3rem}
.product-item{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem}
.product-name{color:var(--dark);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.product-price{color:var(--navy);font-weight:700;flex-shrink:0}

/* SOCIAL + CTA */
.store-footer{display:flex;align-items:center;justify-content:space-between;padding-top:0.85rem;border-top:1px solid var(--lgray)}
.social-icons{display:flex;gap:0.4rem}
.soc-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;background:var(--offwhite);border:1px solid var(--lgray);text-decoration:none;transition:all 0.2s}
.soc-icon:hover{background:var(--navy);color:#fff}
.visit-btn{background:var(--navy);color:#fff;padding:0.5rem 1rem;font-size:0.78rem;font-weight:700;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;font-family:"DM Sans",sans-serif}
.visit-btn:hover{background:var(--blue)}

/* EMPTY + LOADING */
.empty-state{text-align:center;padding:5rem 2rem;color:var(--gray)}
.empty-icon{font-size:3rem;margin-bottom:1rem}
.empty-title{font-size:1.1rem;font-weight:700;color:var(--dark);margin-bottom:0.5rem}
.loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.skeleton{background:#fff;border:1px solid var(--lgray);overflow:hidden}
.skeleton-banner{height:140px;background:linear-gradient(90deg,var(--lgray) 25%,#f3f4f6 50%,var(--lgray) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-body{padding:1.2rem}
.skeleton-line{height:12px;background:linear-gradient(90deg,var(--lgray) 25%,#f3f4f6 50%,var(--lgray) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:0.6rem;border-radius:2px}
.skeleton-line.short{width:60%}
.skeleton-line.shorter{width:40%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:600px){.stores-grid{grid-template-columns:1fr}.filter-inner{gap:0.5rem}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TRAVEX <span>MALL</span></a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">← Home</a>
    <a href="store-landing.html?type=b2c" class="nav-btn">Open a Retail Store</a>
    <a href="seller-login.html" class="nav-link">Seller Login</a>
  </div>
</nav>

<div class="page-header">
  <div class="ph-inner">
    <div class="ph-tag ph-tag-b2c">🥈 Retail Market · B2C</div>
    <div class="ph-title">Browse Retail Stores</div>
    <div class="ph-sub">Discover amazing products from verified retailers across Tanzania</div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <select class="filter-select" id="filterRegion" onchange="applyFilters()">
      <option value="">📍 All Regions</option>
      <option value="Dar es Salaam">📍 Dar es Salaam</option>
      <option value="Dodoma">📍 Dodoma</option>
      <option value="Arusha">📍 Arusha</option>
      <option value="Mwanza">📍 Mwanza</option>
      <option value="Zanzibar">📍 Zanzibar</option>
    </select>
    <select class="filter-select" id="filterCategory" onchange="applyFilters()">
      <option value="">🏷️ All Categories</option>
      <option value="Fashion">👗 Fashion</option>
      <option value="Electronics">📱 Electronics</option>
      <option value="Food & Drinks">🍔 Food & Drinks</option>
      <option value="Beauty">💄 Beauty</option>
      <option value="Home & Living">🏠 Home & Living</option>
      <option value="Health">💊 Health</option>
      <option value="Sports">⚽ Sports</option>
      <option value="Books">📚 Books</option>
    </select>
    <input type="text" class="filter-search" id="filterSearch" placeholder="🔍 Search stores..." oninput="applyFilters()">
    <div class="filter-count" id="filterCount">Loading stores...</div>
  </div>
</div>

<div class="stores-wrap">
  <div id="storesContainer">
    <div class="loading-grid" id="loadingGrid">
      ${[1,2,3,4,5,6].map(()=>`
      <div class="skeleton">
        <div class="skeleton-banner"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line shorter"></div>
        </div>
      </div>`).join("")}
    </div>
  </div>
</div>

<script>
const SB_URL="https://bscecjbgnjitlfmgwcic.supabase.co";
const SB_KEY="sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos";
const {createClient}=supabase;
const sb=createClient(SB_URL,SB_KEY);

const params=new URLSearchParams(window.location.search);
const TYPE=params.get("type")||"b2c";
const IS_B2B=TYPE==="b2b";

let allStores=[];
let allProducts={};

async function init(){
  // Pre-select region from URL param
  const regionParam = params.get("region");
  if(regionParam){
    const regionSelect = document.getElementById("filterRegion");
    if(regionSelect) regionSelect.value = regionParam;
  }
  // Update page header
  if(IS_B2B){
    document.getElementById("phTag").textContent="🏭 B2B Wholesale Suppliers";
    document.getElementById("phTag").className="ph-tag ph-tag-b2b";
    document.getElementById("phTitle").textContent="Browse Wholesale Suppliers";
    document.getElementById("phSub").textContent="Find verified wholesalers and bulk suppliers across Tanzania";
    document.title="Browse Wholesalers — Travex Mall";
    // Update B2B categories
    document.getElementById("filterCategory").innerHTML=`
      <option value="">🏷️ All Categories</option>
      <option value="Clothing Bulk">👗 Clothing Bulk</option>
      <option value="Electronics Bulk">📱 Electronics Bulk</option>
      <option value="Food Supply">🍔 Food Supply</option>
      <option value="Raw Materials">🏭 Raw Materials</option>
      <option value="Construction">🏗️ Construction</option>
      <option value="Agriculture">🌾 Agriculture</option>
    `;
  }

  // Fetch stores
  const {data:stores}=await sb.from("stores")
    .select("*")
    .eq("store_type","b2c")
    .eq("is_active",true)
    .order("created_at",{ascending:false});

  allStores=stores||[];

  // Fetch top products for each store
  if(allStores.length){
    const storeIds=allStores.map(s=>s.id);
    const {data:products}=await sb.from("products")
      .select("*")
      .in("store_id",storeIds)
      .eq("is_active",true)
      .order("created_at",{ascending:false});

    if(products){
      products.forEach(p=>{
        if(!allProducts[p.store_id])allProducts[p.store_id]=[];
        if(allProducts[p.store_id].length<3)allProducts[p.store_id].push(p);
      });
    }
  }

  renderStores(allStores);

  // Realtime — update browse when seller edits their store
  sb.channel("stores-browse")
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "stores",
      filter: `store_type=eq.b2c`
    }, async () => {
      // Refetch all stores on any change
      const {data:updated} = await sb.from("stores")
        .select("*")
        .eq("store_type", store_type)
        .eq("is_active", true)
        .order("created_at", {ascending:false});
      allStores = updated || [];

      // Refresh products
      if(allStores.length) {
        const ids = allStores.map(s=>s.id);
        const {data:prods} = await sb.from("products")
          .select("*").in("store_id", ids)
          .eq("is_active", true);
        allProducts = {};
        if(prods) prods.forEach(p=>{
          if(!allProducts[p.store_id]) allProducts[p.store_id]=[];
          if(allProducts[p.store_id].length<3) allProducts[p.store_id].push(p);
        });
      }
      applyFilters();
    })
    .subscribe();
}

async function refreshStores(){
  const graceDate = new Date(Date.now() - 3*24*60*60*1000).toISOString();
  const {data:fresh}=await sb.from("stores")
    .select("*")
    .eq("store_type","b2c")
    .eq("is_active",true)
    .eq("subscription_status","approved")
    .or(`subscription_expires.is.null,subscription_expires.gt.${graceDate}`)
    .order("created_at",{ascending:false});
  allStores=fresh||[];
  if(allStores.length){
    const ids=allStores.map(s=>s.id);
    const {data:prods}=await sb.from("products").select("*").in("store_id",ids).eq("is_active",true);
    allProducts={};
    if(prods)prods.forEach(p=>{
      if(!allProducts[p.store_id])allProducts[p.store_id]=[];
      if(allProducts[p.store_id].length<3)allProducts[p.store_id].push(p);
    });
  }
  applyFilters();
}

function applyFilters(){
  const region=document.getElementById("filterRegion").value;
  const cat=document.getElementById("filterCategory").value;
  const search=document.getElementById("filterSearch").value.toLowerCase();

  const filtered=allStores.filter(s=>{
    if(region && s.region!==region)return false;
    if(cat && s.category!==cat)return false;
    if(search && !s.store_name?.toLowerCase().includes(search) && !s.description?.toLowerCase().includes(search))return false;
    return true;
  });

  renderStores(filtered);
}

function renderStores(stores){
  const container=document.getElementById("storesContainer");
  const countEl=document.getElementById("filterCount");
  countEl.textContent=stores.length ? `${stores.length} retail stores found` : `No retail stores found`;

  if(!stores.length){
    container.innerHTML=`<div class="empty-state">
      <div class="empty-icon">🛍️</div>
      <div class="empty-title">No retail stores found</div>
      <p style="font-size:0.85rem;margin-top:0.5rem">Try adjusting your filters or search for a different term.</p>
      <a href="store-landing.html?type=b2c" style="display:inline-block;margin-top:1rem;background:var(--navy);color:#fff;padding:0.65rem 1.5rem;font-size:0.82rem;font-weight:700;text-decoration:none">Open a Store →</a>
    </div>`;
    return;
  }

  container.innerHTML=`<div class="stores-grid">${stores.map(store=>buildCard(store)).join("")}</div>`;
}

function buildCard(store){
  const badge=store.badge||"silver";
  const isGold=badge==="gold";
  const products=allProducts[store.id]||[];
  const initials=(store.store_name||"TM").split(" ").map(w=>w[0]).join("").substring(0,2).toUpperCase();

  const productRows=products.length
    ?products.map(p=>`<div class="product-item"><span class="product-name">${p.name}</span><span class="product-price">TZS ${Number(p.price||0).toLocaleString()}</span></div>`).join("")
    :`<div style="font-size:0.78rem;color:var(--gray)">No products listed yet</div>`;

  const socialIcons=[
    store.whatsapp_number?`<a href="https://wa.me/${store.whatsapp_number.replace(/\D/g,"")}" target="_blank" class="soc-icon" title="WhatsApp">💬</a>`:"",
    store.instagram?`<a href="https://instagram.com/${store.instagram}" target="_blank" class="soc-icon" title="Instagram">📸</a>`:"",
    store.tiktok?`<a href="https://tiktok.com/@${store.tiktok}" target="_blank" class="soc-icon" title="TikTok">🎵</a>`:"",
    store.facebook?`<a href="${store.facebook}" target="_blank" class="soc-icon" title="Facebook">📘</a>`:""
  ].filter(Boolean).join("");

  return `<div class="store-card" onclick="window.location='store.html?store=${store.slug||store.id}'">
    <div class="store-banner">
      ${store.banner?`<img src="${store.banner}" alt="${store.store_name}" loading="lazy">`:`<div class="store-banner-placeholder">🏪</div>`}
      <div class="store-badge-overlay ${isGold?"badge-gold-overlay":"badge-silver-overlay"}">${isGold?"🥇 WHOLESALE":"🥈 RETAIL"}</div>
    </div>
    <div class="store-info">
      <div class="store-logo-row">
        <div class="store-logo">${store.logo?`<img src="${store.logo}" alt="">`:`<span>${initials}</span>`}</div>
        <div>
          <div class="store-name">${store.store_name}</div>
          <div class="store-meta">📍 ${store.region||"Tanzania"} · ${store.category||"General"}</div>
        </div>
      </div>
      <div class="store-desc">${store.description||"Visit our store to see our amazing products!"}</div>
      <div class="top-products">
        <div class="top-products-label">🔥 Top Products</div>
        <div class="product-list">${productRows}</div>
      </div>
      <div class="store-footer">
        <div class="social-icons">${socialIcons||'<span style="font-size:0.75rem;color:var(--gray)">—</span>'}</div>
        <a href="store.html?store=${store.slug||store.id}" class="visit-btn" onclick="event.stopPropagation()">Visit Store →</a>
      </div>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
