<!DOCTYPE html>
<html>
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body style="font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem">
<h2 style="color:#C9A84C">Schema Check</h2>
<div id="out"></div>
<script>
const sb = supabase.createClient("https://bscecjbgnjitlfmgwcic.supabase.co","sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos");
const out = document.getElementById('out');
function log(m,c='#fff'){out.innerHTML+=`<div style="color:${c};margin:2px 0">${m}</div>`;}

async function run(){
  // campus_products columns
  log('=== campus_products ===','#C9A84C');
  const {data:p,error:pe} = await sb.from('campus_products').select('*').limit(1);
  if(pe) log('❌ '+pe.message,'#f87171');
  else if(p?.length) log('COLS: '+Object.keys(p[0]).join(' | '),'#4ade80');
  else {
    const {data:pi,error:pie} = await sb.from('campus_products').insert({store_id:'00000000-0000-0000-0000-000000000000',name:'test'}).select();
    log('Insert error (shows cols): '+(pie?.message||'ok'),'#fbbf24');
  }

  // campus_orders columns  
  log('\n=== campus_orders ===','#C9A84C');
  const {data:o,error:oe} = await sb.from('campus_orders').select('*').limit(1);
  if(oe) log('❌ '+oe.message,'#f87171');
  else if(o?.length) log('COLS: '+Object.keys(o[0]).join(' | '),'#4ade80');
  else log('Table empty','#fbbf24');

  // campus_stores - check if font/color exist
  log('\n=== campus_stores (all cols) ===','#C9A84C');
  const {data:s,error:se} = await sb.from('campus_stores').select('*').limit(1);
  if(se) log('❌ '+se.message,'#f87171');
  else if(s?.length) log('COLS: '+Object.keys(s[0]).join(' | '),'#4ade80');
  else {
    // Try insert to discover columns
    const {data:si,error:sie} = await sb.from('campus_stores').insert({store_name:'x',slug:'x-test-'+Date.now(),university:'x',university_abbr:'x'}).select();
    if(si) { log('COLS: '+Object.keys(si[0]).join(' | '),'#4ade80'); await sb.from('campus_stores').delete().eq('slug',si[0].slug); }
    else log('Insert error: '+sie?.message,'#fbbf24');
  }
}
run();
</script></body></html>
