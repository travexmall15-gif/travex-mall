<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Check Schema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem">
<h2 style="color:#C9A84C">Checking actual table columns...</h2>
<div id="out"></div>
<script>
const sb = supabase.createClient(
  "https://bscecjbgnjitlfmgwcic.supabase.co",
  "sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos"
);
const out = document.getElementById('out');
function log(msg, color='#fff') {
  out.innerHTML += `<div style="color:${color};margin:3px 0">${msg}</div>`;
}

async function run() {
  // Check all campus tables
  const tables = ['campus_applications','campus_stores','campus_products','campus_orders','admin_notifications'];
  
  for (const table of tables) {
    log(`\n=== ${table} ===`, '#C9A84C');
    
    // Try select with no filters to get columns
    const {data, error} = await sb.from(table).select('*').limit(1);
    
    if (error) {
      log(`❌ ${error.message} (${error.code})`, '#f87171');
    } else if (data && data.length > 0) {
      log(`✅ Columns: ${Object.keys(data[0]).join(' | ')}`, '#4ade80');
      log(`   Sample: ${JSON.stringify(data[0]).substring(0,200)}`, '#a78bfa');
    } else {
      // Table empty - try inserting with just id to discover required fields
      log(`⚠️ Table empty`, '#fbbf24');
      
      // Try the most minimal possible insert
      const {data:d2, error:e2} = await sb.from(table).insert({}).select();
      if (e2) {
        // Error message usually contains the missing required column
        log(`  Insert error hint: ${e2.message}`, '#fbbf24');
        log(`  Details: ${e2.details}`, '#fbbf24');
      }
    }
  }
  
  log('\n=== DONE ===', '#C9A84C');
}

run();
</script>
</body>
</html>
