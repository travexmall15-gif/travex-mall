<!DOCTYPE html>
<html>
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body style="font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem">
<h2 style="color:#C9A84C">campus_stores — all columns</h2>
<div id="out"></div>
<script>
const sb = supabase.createClient("https://bscecjbgnjitlfmgwcic.supabase.co","sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos");
const out = document.getElementById('out');
async function run(){
  const slug = 'test-'+Date.now();
  const {data,error} = await sb.from('campus_stores').insert({
    store_name: 'TEST_DELETE',
    slug: slug,
    university: 'ARU',
    is_active: true
  }).select();
  if(error){
    out.innerHTML += '<div style="color:#f87171">Error: '+error.message+' | '+error.details+'</div>';
  } else {
    out.innerHTML += '<div style="color:#4ade80">✅ COLUMNS: '+Object.keys(data[0]).join(' | ')+'</div>';
    out.innerHTML += '<pre style="color:#fbbf24;font-size:0.8rem">'+JSON.stringify(data[0],null,2)+'</pre>';
    await sb.from('campus_stores').delete().eq('slug',slug);
    out.innerHTML += '<div style="color:#4ade80">Test record deleted ✓</div>';
  }
}
run();
</script>
</body>
</html>
