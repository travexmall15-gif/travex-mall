<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Travex Mall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",Arial,sans-serif;background:#0D1B3E;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.icon{font-size:4rem;margin-bottom:1.5rem}
h1{font-size:1.5rem;font-weight:800;margin-bottom:0.75rem}
h1 span{color:#C9A84C}
p{font-size:0.9rem;color:rgba(255,255,255,0.6);line-height:1.7;max-width:320px;margin:0 auto 2rem}
.btn{background:#C9A84C;color:#0D1B3E;padding:0.85rem 2rem;font-weight:700;font-size:0.9rem;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn:hover{background:#F0C96B}
.logo{font-size:0.9rem;font-weight:800;color:rgba(255,255,255,0.3);position:fixed;top:1.5rem;left:50%;transform:translateX(-50%)}
.logo span{color:#C9A84C}
</style>
</head>
<body>
<div class="logo">TRAVEX <span>MALL</span></div>
<div>
  <div class="icon">📡</div>
  <h1>You're <span>Offline</span></h1>
  <p>It seems you don't have an internet connection right now. Some pages may still be available from cache.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</div>
</body>
</html>
