<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Travex Mall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D1B3E;--gold:#C9A84C;--gold2:#F0C96B;--white:#fff;--offwhite:#F8F9FC;--gray:#6B7280;--lgray:#E5E7EB;--dark:#111827;--red:#DC2626;--green:#059669}
body{font-family:'Inter',sans-serif;background:var(--offwhite);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--navy);padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.2rem;font-weight:800;color:var(--white);text-decoration:none}
.nav-logo span{color:var(--gold)}
.nav-back{font-size:0.8rem;color:rgba(255,255,255,0.6);text-decoration:none}
.nav-back:hover{color:var(--gold)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.card{background:var(--white);width:100%;max-width:420px;padding:2.5rem;box-shadow:0 4px 24px rgba(13,27,62,0.08);border:1px solid var(--lgray)}
.logo-area{text-align:center;margin-bottom:1.8rem}
.logo-text{font-size:1.4rem;font-weight:800;color:var(--navy)}
.logo-text span{color:var(--gold)}
.logo-sub{font-size:0.8rem;color:var(--gray);margin-top:0.3rem}
.card-title{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:0.3rem}
.card-sub{font-size:0.875rem;color:var(--gray);margin-bottom:1.5rem}
.alert{padding:0.75rem 1rem;font-size:0.85rem;font-weight:500;margin-bottom:1rem;display:none}
.alert-error{background:#FEE2E2;border:1px solid #FECACA;color:var(--red)}
.alert-success{background:#D1FAE5;border:1px solid #A7F3D0;color:var(--green)}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:0.8rem;font-weight:600;color:var(--dark);margin-bottom:0.45rem}
.form-input{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--lgray);font-family:'Inter',sans-serif;font-size:0.875rem;color:var(--dark);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--navy)}
.form-input::placeholder{color:#9CA3AF}
.forgot{display:block;text-align:right;font-size:0.78rem;color:var(--navy);font-weight:600;text-decoration:none;margin-top:-0.5rem;margin-bottom:1rem}
.forgot:hover{color:var(--gold)}
.btn-submit{width:100%;padding:0.85rem;background:var(--navy);color:var(--white);border:none;font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:1rem}
.btn-submit:hover{background:#1B3A6B}
.btn-submit:disabled{background:var(--lgray);color:var(--gray);cursor:not-allowed}
.switch-text{text-align:center;font-size:0.875rem;color:var(--gray)}
.switch-text a{color:var(--navy);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TRAVEX <span>MALL</span></a>
  <a href="index.html" class="nav-back">← Back to Home</a>
</nav>
<main>
  <div class="card">
    <div class="logo-area">
      <div class="logo-text">TRAVEX <span>MALL</span></div>
      <div class="logo-sub">Welcome back</div>
    </div>

    <div id="loginForm">
      <div class="card-title">Log In</div>
      <div class="card-sub">Access your seller dashboard</div>
      <div class="alert alert-error" id="errorMsg"></div>
      <div class="alert alert-success" id="successMsg"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="password" placeholder="Your password">
      </div>

      <a href="#" class="forgot" onclick="showReset()">Forgot password?</a>

      <button class="btn-submit" id="loginBtn" onclick="handleLogin()">Log In to Dashboard</button>
      <div class="switch-text">Don't have an account? <a href="signup.html">Sign up free</a></div>
    </div>

    <div id="resetForm" style="display:none">
      <div class="card-title">Reset Password</div>
      <div class="card-sub">We'll send a reset link to your email</div>
      <div class="alert alert-error" id="resetError"></div>
      <div class="alert alert-success" id="resetSuccess"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="resetEmail" placeholder="your@email.com">
      </div>

      <button class="btn-submit" id="resetBtn" onclick="handleReset()">Send Reset Link</button>
      <div class="switch-text"><a href="#" onclick="showLogin()">← Back to Login</a></div>
    </div>
  </div>
</main>

<script>
  // ── REPLACE THESE WITH YOUR REAL VALUES ──
  const SUPABASE_URL = 'https://bscecjbgnjitlfmgwcic.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos';
  // ─────────────────────────────────────────

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
  function showSuccess(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
  function showReset() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
  }
  function showLogin() {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
  }

  async function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    if (!email || !password) { showError('errorMsg', 'Please enter email and password.'); return; }

    btn.textContent = 'Logging in...';
    btn.disabled = true;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showError('errorMsg', error.message === 'Invalid login credentials'
        ? 'Wrong email or password. Please try again.'
        : error.message);
      btn.textContent = 'Log In to Dashboard';
      btn.disabled = false;
      return;
    }

    // Save session and go to dashboard
    showSuccess('successMsg', 'Login successful! Redirecting...');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
  }

  async function handleReset() {
    const email = document.getElementById('resetEmail').value.trim();
    const btn   = document.getElementById('resetBtn');

    if (!email) { showError('resetError', 'Please enter your email.'); return; }

    btn.textContent = 'Sending...';
    btn.disabled = true;

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html'
    });

    if (error) {
      showError('resetError', error.message);
      btn.textContent = 'Send Reset Link';
      btn.disabled = false;
      return;
    }

    showSuccess('resetSuccess', 'Reset link sent! Check your email inbox.');
    btn.textContent = 'Sent!';
  }

  // Check if already logged in
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  document.addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
