<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <rect width="192" height="192" fill="#0D1B3E"/>
  <rect width="192" height="192" rx="32" fill="#0D1B3E"/>
  <!-- Gold ring -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="#C9A84C" stroke-width="4" opacity="0.6"/>
