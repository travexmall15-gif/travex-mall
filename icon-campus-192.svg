  <rect x="88" y="34" width="16" height="16" fill="#F0C96B" transform="rotate(45 96 42)"/>
  <!-- Cap string/tassel -->
  <line x1="148" y1="68" x2="148" y2="95" stroke="#C9A84C" stroke-width="4"/>
  <circle cx="148" cy="98" r="5" fill="#C9A84C"/>
  <!-- Building columns (store) -->
  <rect x="66" y="100" width="10" height="38" fill="#1B3A6B" rx="2"/>
  <rect x="83" y="100" width="10" height="38" fill="#1B3A6B" rx="2"/>
  <rect x="100" y="100" width="10" height="38" fill="#1B3A6B" rx="2"/>
  <rect x="117" y="100" width="10" height="38" fill="#1B3A6B" rx="2"/>
  <!-- Store roof -->
  <rect x="58" y="92" width="78" height="12" fill="#C9A84C" rx="2"/>
  <!-- Store base -->
  <rect x="55" y="138" width="84" height="10" fill="#C9A84C" rx="2"/>
  <!-- T letter -->
  <text x="96" y="162" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="#F0C96B" text-anchor="middle" letter-spacing="3">CAMPUS</text>
