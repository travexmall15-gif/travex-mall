<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ShopNekt — Database Setup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:#080A0F;color:#E8E9EB;padding:24px;min-height:100vh}
h1{color:#C9A84C;font-size:1.4rem;margin-bottom:8px}
p{color:#6B7280;font-size:13px;margin-bottom:24px}
#log{background:#0D1017;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;height:60vh;overflow-y:auto;font-size:12px;line-height:2}
.ok{color:#10B981}.err{color:#EF4444}.info{color:#60A5FA}.warn{color:#F59E0B}
button{margin-top:16px;padding:14px 32px;background:#C9A84C;color:#0F172A;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:monospace}
button:disabled{opacity:.5;cursor:not-allowed}
#progress{margin-top:12px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
#bar{height:100%;background:linear-gradient(90deg,#C9A84C,#F0C96B);border-radius:3px;width:0;transition:width .3s}
</style>
</head>
<body>
<h1>🔧 ShopNekt — Database Setup</h1>
<p>Database setup is managed with reviewed Supabase migrations. This legacy setup page has been disabled.</p>
<div id="log"><span class="info">For database changes, use the project's Supabase migration workflow. Browser-based database administration is disabled.</span></div>
</body>
</html>
