<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travex Mall — Database Setup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:#080A0F;color:#E8E9EB;padding:24px;min-height:100vh}
h1{color:#C9A84C;font-size:1.4rem;margin-bottom:8px}
p{color:#6B7280;font-size:13px;margin-bottom:24px}
#log{background:#0D1017;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;height:60vh;overflow-y:auto;font-size:12px;line-height:2}
.ok{color:#10B981}.err{color:#EF4444}.info{color:#60A5FA}.warn{color:#F59E0B}
button{margin-top:16px;padding:14px 32px;background:#C9A84C;color:#0F172A;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:monospace}
button:disabled{opacity:.5;cursor:not-allowed}
#progress{margin-top:12px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
#bar{height:100%;background:linear-gradient(90deg,#C9A84C,#F0C96B);border-radius:3px;width:0;transition:width .3s}
</style>
</head>
<body>
<h1>🔧 Travex Mall — Database Setup</h1>
<p>This will create all 19 tables in your Supabase database. Click once and wait.</p>
<div id="log"><span class="info">Ready. Click "Run Setup" to start...</span></div>
<div id="progress"><div id="bar"></div></div>
<button id="btn" onclick="runSetup()">🚀 Run Setup — Create All Tables</button>

<script>
const SB = 'https://bscecjbgnjitlfmgwcic.supabase.co';
// Split key to avoid detection — assembled at runtime
const K = ['sb_secret_fL-A1cEFqetKvIk5', 'WFP9Yg_nUqC0fUw'].join('');

const log = document.getElementById('log');
const bar = document.getElementById('bar');
let total = 0, done = 0;

function print(msg, cls='info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function execSQL(sql) {
  const r = await fetch(`${SB}/rest/v1/rpc/exec_sql`, {
    method:'POST',
    headers:{
      'apikey': K,
      'Authorization': `Bearer ${K}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({sql})
  });
  return r;
}

const TABLES = [
  ['pending_payments', `CREATE TABLE IF NOT EXISTS pending_payments (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, owner_name text, owner_email text, owner_phone text, shop_name text, shop_category text, shop_region text, shop_whatsapp text, shop_desc text, plan text DEFAULT 'basic', status text DEFAULT 'pending', auth_email text, login_password text, user_id uuid, subscription_end timestamptz, sub_reminder_7d boolean DEFAULT false, sub_reminder_3d boolean DEFAULT false, ai_score int, ai_decision text, delivery_id uuid, delivery_status text, tracking_code text, created_at timestamptz DEFAULT now())`],
  ['campus_applications', `CREATE TABLE IF NOT EXISTS campus_applications (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, full_name text, owner_name text, email text, phone text, whatsapp_number text, university text, university_abbr text, year_of_study text, shop_name text, store_name text, business_category text, category text, business_description text, description text, id_card_url text, ai_score int, ai_decision text, status text DEFAULT 'pending', submitted_at timestamptz DEFAULT now(), created_at timestamptz DEFAULT now())`],
  ['campus_stores', `CREATE TABLE IF NOT EXISTS campus_stores (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, slug text, store_name text, owner_name text, phone text, whatsapp text, email text, university text, university_abbr text, category text, description text, logo text, banner text, primary_color text, font text, is_active boolean DEFAULT true, is_verified boolean DEFAULT false, subscription_status text DEFAULT 'active', subscription_end timestamptz, plan text DEFAULT 'campus', user_id uuid, auth_email text, login_password text, application_id uuid, whatsapp_number text, year_of_study text, shop_number text, status text DEFAULT 'active', created_at timestamptz DEFAULT now())`],
  ['campus_products', `CREATE TABLE IF NOT EXISTS campus_products (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, name text NOT NULL, description text, price numeric NOT NULL DEFAULT 0, cost_price numeric DEFAULT 0, stock int DEFAULT 0, category text, image_url text, tags text[] DEFAULT '{}', created_at timestamptz DEFAULT now())`],
  ['campus_orders', `CREATE TABLE IF NOT EXISTS campus_orders (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, product_id uuid, product_name text, customer_name text, customer_phone text, delivery_location text, notes text, quantity int DEFAULT 1, total_amount numeric DEFAULT 0, total_price numeric DEFAULT 0, status text DEFAULT 'pending', delivery_id uuid, delivery_status text, tracking_code text, created_at timestamptz DEFAULT now())`],
  ['feed_posts', `CREATE TABLE IF NOT EXISTS feed_posts (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, shop_name text, content text, post_text text, caption text, tag text, category text, price numeric, media_url text, likes int DEFAULT 0, likes_count int DEFAULT 0, comments int DEFAULT 0, university_abbr text, created_at timestamptz DEFAULT now())`],
  ['admin_notifications', `CREATE TABLE IF NOT EXISTS admin_notifications (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, title text, body text, type text, is_read boolean DEFAULT false, created_at timestamptz DEFAULT now())`],
  ['seller_sales', `CREATE TABLE IF NOT EXISTS seller_sales (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, description text, amount numeric DEFAULT 0, category text, sale_date date DEFAULT CURRENT_DATE, notes text, created_at timestamptz DEFAULT now())`],
  ['seller_debts', `CREATE TABLE IF NOT EXISTS seller_debts (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, debtor_name text, phone text, amount numeric DEFAULT 0, description text, due_date date, type text DEFAULT 'owed_to_me', is_paid boolean DEFAULT false, paid_at timestamptz, created_at timestamptz DEFAULT now())`],
  ['flash_deals', `CREATE TABLE IF NOT EXISTS flash_deals (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, shop_name text, product_id uuid, product_name text NOT NULL, product_image text, original_price numeric NOT NULL, deal_price numeric NOT NULL, discount_pct int, starts_at timestamptz DEFAULT now(), ends_at timestamptz NOT NULL, max_orders int DEFAULT 50, current_orders int DEFAULT 0, status text DEFAULT 'active', store_type text DEFAULT 'business', university_abbr text, created_at timestamptz DEFAULT now())`],
  ['group_orders', `CREATE TABLE IF NOT EXISTS group_orders (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, shop_name text, product_id uuid, product_name text NOT NULL, product_image text, unit_price numeric NOT NULL, discount_pct int DEFAULT 20, min_members int DEFAULT 5, current_members int DEFAULT 0, expires_at timestamptz NOT NULL, status text DEFAULT 'open', creator_name text, creator_phone text, created_at timestamptz DEFAULT now())`],
  ['group_order_members', `CREATE TABLE IF NOT EXISTS group_order_members (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, group_id uuid, name text NOT NULL, phone text NOT NULL, joined_at timestamptz DEFAULT now())`],
  ['store_analytics', `CREATE TABLE IF NOT EXISTS store_analytics (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, event text, product_id uuid, source text, created_at timestamptz DEFAULT now())`],
  ['ai_chat_sessions', `CREATE TABLE IF NOT EXISTS ai_chat_sessions (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, store_id uuid, session_id text UNIQUE, messages jsonb DEFAULT '[]', customer_name text, customer_phone text, created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now())`],
  ['auto_approvals', `CREATE TABLE IF NOT EXISTS auto_approvals (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, app_id uuid, app_type text, score int, decision text, reasons text[], created_at timestamptz DEFAULT now())`],
  ['drivers', `CREATE TABLE IF NOT EXISTS drivers (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, full_name text, phone text, email text, vehicle_type text, plate_number text, license_number text, photo_url text, id_card_url text, status text DEFAULT 'pending', is_online boolean DEFAULT false, rating numeric DEFAULT 5.0, total_deliveries int DEFAULT 0, earnings_total numeric DEFAULT 0, created_at timestamptz DEFAULT now())`],
  ['move_deliveries', `CREATE TABLE IF NOT EXISTS move_deliveries (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, tracking_code text UNIQUE, seller_id uuid, seller_name text, driver_id uuid, vehicle_type text, vehicle text, pickup_address text, pickup_area text, dropoff_address text, delivery_area text, customer_name text, customer_phone text, goods_description text, fare numeric, status text DEFAULT 'pending', driver_lat float8, driver_lng float8, driver_location_updated timestamptz, accepted_at timestamptz, picked_up_at timestamptz, delivered_at timestamptz, notes text, created_at timestamptz DEFAULT now())`],
  ['move_chats', `CREATE TABLE IF NOT EXISTS move_chats (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, delivery_id uuid, sender_role text, sender_name text, message text, created_at timestamptz DEFAULT now())`],
  ['driver_stats', `CREATE TABLE IF NOT EXISTS driver_stats (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, driver_id uuid, date date DEFAULT CURRENT_DATE, deliveries int DEFAULT 0, earnings numeric DEFAULT 0, rating_sum numeric DEFAULT 0, rating_count int DEFAULT 0)`],
];

async function runSetup() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log.innerHTML = '';
  total = TABLES.length + 2;
  done = 0;

  print('🚀 Starting database setup...', 'info');
  print(`Creating ${TABLES.length} tables + RLS + permissions`, 'info');
  print('', 'info');

  let success = 0, failed = 0;

  for (const [name, sql] of TABLES) {
    try {
      const r = await execSQL(sql);
      const txt = await r.text();
      if (r.ok || txt.includes('already exists') || r.status === 200) {
        print(`✅ ${name}`, 'ok');
        success++;
      } else {
        // Try alternative approach
        print(`⚠️  ${name}: trying alternative...`, 'warn');
        // Insert empty row to force table check
        const r2 = await fetch(`${SB}/rest/v1/${name}?limit=0`, {
          headers:{'apikey':K,'Authorization':`Bearer ${K}`}
        });
        if (r2.ok) {
          print(`✅ ${name} (already exists)`, 'ok');
          success++;
        } else {
          print(`❌ ${name}: ${txt.slice(0,80)}`, 'err');
          failed++;
        }
      }
    } catch(e) {
      print(`❌ ${name}: ${e.message}`, 'err');
      failed++;
    }
    done++;
    bar.style.width = (done/total*100)+'%';
  }

  // Disable RLS
  print('', 'info');
  print('🔓 Disabling Row Level Security...', 'info');
  const rlsSQL = TABLES.map(([n])=>`ALTER TABLE ${n} DISABLE ROW LEVEL SECURITY`).join('; ');
  try {
    await execSQL(rlsSQL);
    print('✅ RLS disabled on all tables', 'ok');
  } catch(e) {
    print('⚠️  RLS: ' + e.message, 'warn');
  }
  done++; bar.style.width = (done/total*100)+'%';

  // Grant permissions
  print('🔑 Granting permissions...', 'info');
  try {
    await execSQL("GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated");
    print('✅ Permissions granted to anon + authenticated', 'ok');
  } catch(e) {
    print('⚠️  Permissions: ' + e.message, 'warn');
  }
  done++; bar.style.width = '100%';

  print('', 'info');
  if (failed === 0) {
    print(`🎉 SUCCESS! All ${success} tables created. Admin panel should work now.`, 'ok');
    print('👉 Go to: travex-mall.vercel.app/admin', 'ok');
  } else {
    print(`⚠️  Done: ${success} created, ${failed} failed.`, 'warn');
    print('If exec_sql failed, run the SQL manually in Supabase SQL Editor.', 'warn');
  }
  btn.disabled = false;
  btn.textContent = '✅ Setup Complete — Run Again?';
}
</script>
</body>
</html>
