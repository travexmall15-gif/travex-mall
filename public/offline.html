<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Offline — ShopNekt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Inter',sans-serif;background:#050B2E;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.2rem;text-align:center;padding:2rem}
.logo{font-size:1.5rem;font-weight:900;letter-spacing:-0.03em;margin-bottom:.5rem}
.logo span{color:#C9A84C}
.icon{width:72px;height:72px;border-radius:50%;background:rgba(201,168,76,.1);border:2px solid rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center}
h1{font-size:1.3rem;font-weight:800}
p{font-size:.88rem;color:rgba(255,255,255,.5);line-height:1.75;max-width:320px}
.btn{display:inline-block;background:#C9A84C;color:#050B2E;padding:.75rem 2rem;border-radius:999px;font-weight:700;font-size:.88rem;text-decoration:none;cursor:pointer;border:none;margin-top:.5rem;font-family:inherit}
.btn:hover{background:#D4B55A}
.hint{font-size:.75rem;color:rgba(255,255,255,.3);margin-top:.5rem}
</style>
</head>
<body>
<div class="logo">SHOP<span>NEKT</span></div>
<div class="icon">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="2">
    <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
  </svg>
</div>
<h1>You are offline</h1>
<p>ShopNekt needs an internet connection to load. Check your connection and try again.</p>
<button class="btn" onclick="window.location.reload()">Try Again</button>
<div class="hint">shopnekt.vercel.app</div>
</body>
</html>
