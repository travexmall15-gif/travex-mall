<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Orders, ShopNekt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<link rel="stylesheet" href="shared.css"/>
<script src="/lang.js"></script>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
<div id="sidebar"></div>
<div class="main-wrapper">
  <div class="main-header">
    <div><div class="header-title">Orders</div><div class="header-sub">All customer orders for your store</div></div>
    <div class="header-right">
      <select id="statusFilter" onchange="filterOrders()" style="padding:8px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:#fff">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
  </div>
  <div class="main-content">

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="statPending" style="color:#F97316">0</div></div>
      <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value" id="statDelivered" style="color:#22C55E">0</div></div>
      <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" id="statRevenue">TZS 0</div></div>
    </div>

    <!-- Orders Table -->
    <div class="table-card">
      <div class="table-card-header">
        <div><div class="table-card-title">All Orders</div></div>
        <input id="searchInput" oninput="filterOrders()" placeholder="Search by customer, product..." style="padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;outline:none;font-family:inherit;width:220px"/>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:var(--bg)">
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">#</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Customer</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Product</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Amount</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Status</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Date</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
        <div id="emptyState" style="display:none;text-align:center;padding:3rem 0">
          <i class="ti ti-shopping-cart" style="font-size:40px;color:#CBD5E1;display:block;margin-bottom:10px"></i>
          <div style="font-size:14px;color:#94A3B8">No orders yet. Share your store link to get your first order!</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="dashboard.js"></script>
<script src="aria-engine.js"></script>
<script src="aria-widget.js"></script>
<script src="i18n.js"></script>
<script>
let allOrders = []
const fmt = n => 'TZS ' + Number(n||0).toLocaleString('en-US')
const STATUS_COLORS = { pending:'#F97316', confirmed:'#3B82F6', delivered:'#22C55E', cancelled:'#EF4444' }
const STATUS_BG = { pending:'rgba(249,115,22,.1)', confirmed:'rgba(59,130,246,.1)', delivered:'rgba(34,197,94,.1)', cancelled:'rgba(239,68,68,.1)' }

async function loadData() {
  Auth.requireAuth()
  const session = JSON.parse(localStorage.getItem('travex_session')||'{}')
  const { data, error } = await sb.from('orders')
    .select('*').eq('store_id', session.id).order('created_at', { ascending: false })
  if (error) { showToast('Error loading orders'); document.getElementById('loadingOverlay').style.display='none'; return }
  allOrders = data || []
  renderOrders(allOrders)
  updateStats(allOrders)
  document.getElementById('loadingOverlay').style.display = 'none'
}

function updateStats(orders) {
  document.getElementById('statTotal').textContent = orders.length
  document.getElementById('statPending').textContent = orders.filter(o=>o.status==='pending').length
  document.getElementById('statDelivered').textContent = orders.filter(o=>o.status==='delivered').length
  const revenue = orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+Number(o.total_amount||o.total_price||0),0)
  document.getElementById('statRevenue').textContent = fmt(revenue)
}

function filterOrders() {
  const q = document.getElementById('searchInput').value.toLowerCase()
  const status = document.getElementById('statusFilter').value
  const filtered = allOrders.filter(o =>
    (!q || (o.customer_name||'').toLowerCase().includes(q) || (o.product_name||'').toLowerCase().includes(q) || (o.customer_phone||'').includes(q)) &&
    (!status || o.status === status)
  )
  renderOrders(filtered)
}

function renderOrders(orders) {
  const tbody = document.getElementById('ordersTable')
  const empty = document.getElementById('emptyState')
  if (!orders.length) { tbody.innerHTML=''; empty.style.display='block'; return }
  empty.style.display = 'none'
  const wa = (phone) => (phone||'').replace(/\D/g,'')
  tbody.innerHTML = orders.map((o,i) => `
    <tr style="border-top:1px solid var(--border);transition:background .15s" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
      <td style="padding:12px 14px;font-size:12px;color:var(--text-muted)">#${String(i+1).padStart(3,'0')}</td>
      <td style="padding:12px 14px">
        <div style="font-size:13px;font-weight:600;color:var(--text-primary)">${o.customer_name||'Unknown'}</div>
        <div style="font-size:11px;color:var(--text-muted)">${o.customer_phone||''}</div>
      </td>
      <td style="padding:12px 14px">
        <div style="font-size:13px;color:var(--text-primary)">${o.product_name||'Order'}</div>
        <div style="font-size:11px;color:var(--text-muted)">Qty: ${o.quantity||1}</div>
      </td>
      <td style="padding:12px 14px;font-weight:700;font-size:13px;color:var(--navy)">${fmt(o.total_amount||o.total_price)}</td>
      <td style="padding:12px 14px">
        <select onchange="updateStatus('${o.id}',this.value)" style="background:${STATUS_BG[o.status]||'var(--bg)'};color:${STATUS_COLORS[o.status]||'var(--text-primary)'};border:none;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
          <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
      </td>
      <td style="padding:12px 14px;font-size:11px;color:var(--text-muted)">${new Date(o.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
      <td style="padding:12px 14px">
        <div style="display:flex;gap:5px">
          ${wa(o.customer_phone) ? `<a href="https://wa.me/${wa(o.customer_phone)}?text=Hello ${encodeURIComponent(o.customer_name||'')}, regarding your order for ${encodeURIComponent(o.product_name||'')}..." target="_blank" style="padding:4px 9px;background:#25D366;color:#fff;border-radius:7px;font-size:11px;font-weight:700;text-decoration:none"><i class="ti ti-brand-whatsapp"></i></a>` : ''}
          <button onclick="viewOrder('${o.id}')" style="padding:4px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:11px;cursor:pointer;color:var(--text-secondary)"><i class="ti ti-eye"></i></button>
        </div>
      </td>
    </tr>
  `).join('')
}

async function updateStatus(id, status) {
  const { error } = await sb.from('orders').update({ status, updated_at: new Date().toISOString() }).eq('id', id)
  if (error) { showToast('Error updating status'); return }
  showToast(`Order marked as ${status}`)
  const order = allOrders.find(o=>o.id===id)
  if (order) order.status = status
  updateStats(allOrders)
}

function viewOrder(id) {
  const o = allOrders.find(x=>x.id===id)
  if (!o) return
  alert(`ORDER DETAILS\n\nCustomer: ${o.customer_name}\nPhone: ${o.customer_phone}\nProduct: ${o.product_name}\nQty: ${o.quantity||1}\nAmount: ${fmt(o.total_amount||o.total_price)}\nStatus: ${o.status}\nNotes: ${o.notes||'None'}\nDate: ${new Date(o.created_at).toLocaleString()}`)
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3000)
}

document.addEventListener('DOMContentLoaded', loadData)
</script>
</body>
</html>
