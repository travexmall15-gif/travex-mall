<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Vybe, ShopNekt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<style>
.post-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.post-content{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:10px}
.post-tag{display:inline-block;background:var(--bg2);color:var(--navy);font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;margin-right:6px}
.post-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
</style>
<script src="/lang.js"></script>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div class="loading-text">Loading Vybe...</div></div>
<div class="sidebar" id="sidebar"></div>
<div class="main-wrapper">
  <div class="main-header">
    <div><div class="header-title">Social Vybe </div><div class="header-sub">Post products, grow your brand</div></div>
    <div class="header-right">
      <button class="btn btn-gold" onclick="openModal('postModal')"><i class="ti ti-plus"></i> New Post</button>
    </div>
  </div>
  <div class="main-content">
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="stat-label"><i class="ti ti-bolt"></i> My Posts</div><div class="stat-value" id="vPosts">-</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-heart"></i> Total Likes</div><div class="stat-value" id="vLikes">-</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-eye"></i> This Month</div><div class="stat-value" id="vMonth">-</div></div>
    </div>

    <div id="postsContainer">
      <div class="empty-state"><i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i><p>Loading posts...</p></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="postModal" onclick="if(event.target===this)closeModal('postModal')">
  <div class="modal">
    <div class="modal-header"><div class="modal-title"> New Vybe Post</div><button class="modal-close" onclick="closeModal('postModal')"></button></div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div class="form-group"><label class="form-label">Post Content *</label>
        <textarea class="form-textarea" id="pContent" placeholder="Tell your customers about a product, offer or update..." style="min-height:90px"></textarea>
      </div>      <!-- Image / Video URL -->
      <div class="form-group">
        <label class="form-label"><i class="ti ti-photo"></i> Image / Video URL <span style="color:var(--muted);font-weight:400;font-size:11px">(optional)</span></label>
        <div style="display:flex;gap:8px;align-items:stretch">
          <input class="form-input" id="pMedia" type="url" placeholder="https://... paste image or video link" style="flex:1;margin:0" />
          <label for="pMediaFile" style="display:flex;align-items:center;gap:5px;padding:0 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap">
            <i class="ti ti-upload"></i> Upload
          </label>
          <input type="file" id="pMediaFile" accept="image/*,video/*" style="display:none" onchange="handleMediaUpload(this)" />
        </div>
        <div id="pMediaPreview" style="display:none;margin-top:8px;border-radius:10px;overflow:hidden;max-height:180px;border:1.5px solid var(--border)">
          <img id="pMediaPreviewImg" style="width:100%;max-height:180px;object-fit:cover;display:none" />
          <video id="pMediaPreviewVid" style="width:100%;max-height:180px;display:none" controls muted></video>
        </div>
      </div>
      <!-- Media type selector -->
      <div class="form-group">
        <label class="form-label">Media Type</label>
        <select class="form-select" id="pMediaType">
          <option value="image">️ Image</option>
          <option value="video"> Video / Reel</option>
          <option value="">Text only</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Category Tag</label>
          <select class="form-select" id="pTag">
            <option value="Products">Products</option>
            <option value="Offer">Offer</option>
            <option value="Announcement">Announcement</option>
            <option value="Fashion">Fashion</option>
            <option value="Food">Food</option>
            <option value="Electronics">Electronics</option>
            <option value="Services">Services</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Price (optional)</label>
          <input class="form-input" id="pPrice" type="number" placeholder="e.g. 15000">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('postModal')" data-i18n="Cancel">Cancel</button>
      <button class="btn btn-gold" id="postBtn" onclick="submitPost()"><i class="ti ti-send"></i> Post to Vybe</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><i class="ti ti-home"></i><span data-i18n="Home">Home</span></a>
  <a href="products.html"><i class="ti ti-package"></i><span data-i18n="Products">Products</span></a>
  <a href="orders.html"><i class="ti ti-shopping-cart"></i><span data-i18n="Orders">Orders</span></a>

</nav>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dashboard.js"></script>
<script src="i18n.js"></script>
<script>
// Safety: hide overlay after 3s max
setTimeout(function(){var o=document.getElementById('loadingOverlay');if(o)o.style.display='none'},3000);

let posts = [], shopData = null;

(async () => {
  const session = Auth.requireAuth();
    document.getElementById('loadingOverlay').style.display = 'none';
  if (!session) return;
  shopData = await Shop.get(session.user.email);
  await loadSidebar('vybe', shopData);
  // If shopData is null (RLS blocks pending_payments), load all recent posts
  if (shopData?.id) {
    posts = await DB.vybe.getPosts(shopData.id);
  } else {
    // Fallback: load all posts
    const { data } = await sb.from('feed_posts').select('*').order('created_at',{ascending:false}).limit(50);
    posts = data || [];
  }
  renderPosts();
  showLoading(false);
})();

function renderPosts() {
  const initials = (shopData?.shop_name||'S').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const total_likes = posts.reduce((a,p)=>a+Number(p.likes||0),0);
  const month_posts = posts.filter(p=>{
    const d=new Date(p.created_at); const n=new Date();
    return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  });
  document.getElementById('vPosts').textContent = posts.length;
  document.getElementById('vLikes').textContent = total_likes;
  document.getElementById('vMonth').textContent = month_posts.length;

    const el = document.getElementById('postsContainer');
  if (!posts.length) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-bolt"></i><h4>No posts yet</h4><p>Post your first product or update to reach customers.</p><button class="btn btn-gold" onclick="openModal('postModal')"><i class="ti ti-plus"></i> Create Post</button></div>`;
    return;
  }
  el.innerHTML = posts.map(p=>`
    <div class="post-card">
      ${p.media_url ? `<div style="margin:-18px -18px 12px;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;max-height:220px">${p.media_type==='video'?`<video src="${p.media_url}" style="width:100%;max-height:220px;object-fit:cover" controls muted playsinline></video>`:`<img src="${p.media_url}" style="width:100%;max-height:220px;object-fit:cover" loading="lazy" onerror="this.style.display='none'" />`}</div>` : ''}
      <div class="post-header">
        <div class="post-avatar">${initials}</div>
        <div>
          <div class="fw-700 fs-13">${shopData?.shop_name||'My Shop'}</div>
          <div class="text-muted fs-12">${timeAgo(p.created_at)}</div>
        </div>
        <button class="btn-icon ml-auto" onclick="deletePost('${p.id}')" style="color:var(--red)" title="Delete"><i class="ti ti-trash"></i></button>
      </div>
      <div class="post-content">${p.content||p.post_text||''}</div>
      <div style="margin-bottom:10px">
        ${p.tag||p.category?`<span class="post-tag">${p.tag||p.category}</span>`:''}
        ${p.price?`<span class="post-tag" style="background:rgba(29,78,216,0.15);color:var(--gold)">${formatTZS(p.price)}</span>`:''}
      </div>
      <div class="post-meta">
        <span><i class="ti ti-heart"></i> ${p.likes||0} likes</span>
        <span><i class="ti ti-message"></i> ${p.comments||0} comments</span>
      </div>
    </div>`).join('');
}

// Handle file upload → convert to base64 data URL for preview
function handleMediaUpload(input) {
  const file = input.files[0];
  if (!file) return;
  window._vybeMediaFile = file;
  const isVideo = file.type.startsWith('video/');
  const url = URL.createObjectURL(file);
  document.getElementById('pMediaPreview').style.display = 'block';
  document.getElementById('pMediaPreviewImg').style.display = isVideo ? 'none' : 'block';
  document.getElementById('pMediaPreviewVid').style.display = isVideo ? 'block' : 'none';
  if (isVideo) document.getElementById('pMediaPreviewVid').src = url;
  else document.getElementById('pMediaPreviewImg').src = url;
  document.getElementById('pMediaType').value = isVideo ? 'video' : 'image';
  document.getElementById('pMedia').value = '';
}

// Watch URL input for preview
document.addEventListener('DOMContentLoaded', () => {
  const mediaInput = document.getElementById('pMedia');
  if (mediaInput) {
    mediaInput.addEventListener('input', function() {
      const url = this.value.trim();
      if (!url) { document.getElementById('pMediaPreview').style.display='none'; return; }
      const isVideo = url.match(/\.(mp4|webm|ogg|mov)$/i);
      document.getElementById('pMediaPreview').style.display = 'block';
      document.getElementById('pMediaPreviewImg').style.display = isVideo ? 'none' : 'block';
      document.getElementById('pMediaPreviewVid').style.display = isVideo ? 'block' : 'none';
      if (isVideo) { document.getElementById('pMediaPreviewVid').src = url; }
      else { document.getElementById('pMediaPreviewImg').src = url; }
    });
  }
});

async function submitPost() {
  const text = document.getElementById('pContent').value.trim();
  if (!text) { showToast('Write something first!', 'error'); return; }
  if (!shopData?.id) { showToast('Session error. Please refresh.', 'error'); return; }

  const btn = document.getElementById('postBtn');
  if (btn.disabled) return; // prevent duplicates
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Posting...';

  try {
    let mediaUrl  = document.getElementById('pMedia').value.trim() || null;
    let mediaType = document.getElementById('pMediaType').value || null;

    // Upload file to Supabase Storage if user selected a file
    if (window._vybeMediaFile) {
      showToast('Uploading media...', 'info');
      const { url, error: upErr } = await uploadToStorage(window._vybeMediaFile, 'vybe');
      if (upErr) throw new Error('Upload failed: ' + upErr.message);
      mediaUrl  = url;
      mediaType = window._vybeMediaFile.type.startsWith('video/') ? 'video' : 'image';
      window._vybeMediaFile = null;
    }

    const item = {
      store_id:    shopData.id,
      shop_name:   shopData.shop_name || shopData.store_name,
      shop_logo:   shopData.shop_logo || null,
      content:     text, post_text: text, caption: text,
      tag:         document.getElementById('pTag').value || null,
      category:    document.getElementById('pTag').value || null,
      price:       Number(document.getElementById('pPrice').value) || null,
      media_url:   mediaUrl,
      media_type:  mediaType,
      likes: 0, likes_count: 0,
    };

    const { error } = await DB.vybe.post(item);
    if (error) throw new Error(error.message);

    showToast('Posted to Vybe!', 'success');
    closeModal('postModal');
    document.getElementById('pContent').value = '';
    document.getElementById('pTag').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pMedia').value = '';
    document.getElementById('pMediaType').value = '';
    document.getElementById('pMediaPreview').style.display = 'none';
    window._vybeMediaFile = null;
    await loadPosts();

  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> Post to Vybe';
  }
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await DB.vybe.delete(id);
  posts = posts.filter(p=>p.id!==id);
  renderPosts();
  showToast(' Post deleted','success');
}
</script>
