<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products, Travex Mall</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading products...</div>
</div>
<div class="sidebar" id="sidebar"></div>
<div class="main-wrapper">
  <div class="main-header">
    <div><div class="header-title">Products</div><div class="header-sub">Manage your product listings</div></div>
    <div class="header-right">
      <button class="btn btn-gold" onclick="openAddModal()">
        <i class="ti ti-plus"></i> Add Product
      </button>
    </div>
  </div>
  <div class="main-content">
    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="stat-label"><i class="ti ti-package"></i> Total</div><div class="stat-value" id="pTotal">-</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-circle-check"></i> In Stock</div><div class="stat-value" id="pInStock" style="color:var(--green)">-</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-alert-triangle"></i> Low Stock</div><div class="stat-value" id="pLow" style="color:var(--yellow)">-</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-x"></i> Out of Stock</div><div class="stat-value" id="pOut" style="color:var(--red)">-</div></div>
    </div>
    <!-- Search & Filter -->
    <div class="table-card">
      <div class="table-card-header">
        <div class="table-card-title">All Products</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input class="form-input" id="searchInput" placeholder="Search products..." 
            style="width:200px" oninput="renderProducts()">
          <select class="form-select" id="stockFilter" style="width:140px" onchange="renderProducts()">
            <option value="all">All Stock</option>
            <option value="in">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="out">Out of Stock</option>
          </select>
        </div>
      </div>
      <div id="productsTable"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="productModal" onclick="if(event.target===this)closeModal('productModal')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Product</div>
      <button class="modal-close" onclick="closeModal('productModal')"></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="pId">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input class="form-input" id="pName" placeholder="e.g. Blue Dress">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <input class="form-input" id="pCategory" placeholder="e.g. Fashion">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Price (TZS) *</label>
          <input class="form-input" id="pPrice" type="number" placeholder="15000">
        </div>
        <div class="form-group">
          <label class="form-label">Stock Quantity *</label>
          <input class="form-input" id="pStock" type="number" placeholder="10">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cost Price (TZS)</label>
          <input class="form-input" id="pCost" type="number" placeholder="10000">
        </div>
        <div class="form-group">
          <label class="form-label">Low Stock Alert (qty)</label>
          <input class="form-input" id="pAlert" type="number" placeholder="5">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="pDesc" placeholder="Describe your product..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('productModal')">Cancel</button>
      <button class="btn btn-gold" onclick="saveProduct()">
        <i class="ti ti-check"></i> Save Product
      </button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><i class="ti ti-home"></i><span>Home</span></a>
  <a href="products.html" class="active"><i class="ti ti-package"></i><span>Products</span></a>
  <a href="orders.html"><i class="ti ti-shopping-cart"></i><span>Orders</span></a>
  <a href="accounting.html"><i class="ti ti-cash"></i><span>Finance</span></a>
  <a href="settings.html"><i class="ti ti-settings"></i><span>More</span></a>
</nav>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dashboard.js"></script>
<script>
let products = [], shopId = null;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  const shopData = await Shop.get(session.user.email);
  shopId = shopData?.id;
  await loadSidebar('products', shopData);
  products = await DB.products.getAll(shopId);
  renderProducts();
  updateStats();
  showLoading(false);
})();

function updateStats() {
  document.getElementById('pTotal').textContent = products.length;
  document.getElementById('pInStock').textContent = products.filter(p => Number(p.stock) > Number(p.stock_alert||5)).length;
  document.getElementById('pLow').textContent = products.filter(p => Number(p.stock) > 0 && Number(p.stock) <= Number(p.stock_alert||5)).length;
  document.getElementById('pOut').textContent = products.filter(p => Number(p.stock) === 0).length;
}

function renderProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const sf = document.getElementById('stockFilter').value;
  let list = products.filter(p => {
    const match = !q || (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
    const alert = Number(p.stock_alert||5);
    const stock = Number(p.stock||0);
    const stockOk = sf==='all'||(sf==='out'&&stock===0)||(sf==='low'&&stock>0&&stock<=alert)||(sf==='in'&&stock>alert);
    return match && stockOk;
  });

  const el = document.getElementById('productsTable');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-package"></i><h4>No products found</h4><p>Add your first product to start selling.</p><button class="btn btn-gold" onclick="openAddModal()"><i class="ti ti-plus"></i> Add Product</button></div>`;
    return;
  }
  el.innerHTML = `<table><thead><tr>
    <th>Product</th><th>Category</th><th>Price</th><th>Cost</th><th>Stock</th><th>Status</th><th>Actions</th>
  </tr></thead><tbody>${list.map(p => {
    const stock = Number(p.stock||0);
    const alert = Number(p.stock_alert||5);
    const profit = Number(p.price||0) - Number(p.cost_price||0);
    const status = stock===0 ? ['badge-danger','Out of Stock'] : stock<=alert ? ['badge-warning','Low Stock'] : ['badge-success','In Stock'];
    return `<tr>
      <td><div class="text-navy fw-700">${p.name}</div><div class="text-muted fs-12">${truncate(p.description||'',35)}</div></td>
      <td><span class="badge badge-navy">${p.category||'-'}</span></td>
      <td class="fw-700">${formatTZS(p.price)}</td>
      <td class="text-muted">${p.cost_price ? formatTZS(p.cost_price) : '-'}</td>
      <td><b>${stock}</b> <span class="text-muted fs-12">units</span></td>
      <td><span class="badge ${status[0]}">${status[1]}</span></td>
      <td><div style="display:flex;gap:6px">
        <button class="btn-icon" onclick="editProduct('${p.id}')" title="Edit"><i class="ti ti-pencil"></i></button>
        <button class="btn-icon" onclick="deleteProduct('${p.id}')" title="Delete" style="color:var(--red)"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function openAddModal() {
  document.getElementById('pId').value = '';
  document.getElementById('pName').value = '';
  document.getElementById('pCategory').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pStock').value = '';
  document.getElementById('pCost').value = '';
  document.getElementById('pAlert').value = '5';
  document.getElementById('pDesc').value = '';
  document.getElementById('modalTitle').textContent = 'Add Product';
  openModal('productModal');
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pId').value = p.id;
  document.getElementById('pName').value = p.name||'';
  document.getElementById('pCategory').value = p.category||'';
  document.getElementById('pPrice').value = p.price||'';
  document.getElementById('pStock').value = p.stock||'';
  document.getElementById('pCost').value = p.cost_price||'';
  document.getElementById('pAlert').value = p.stock_alert||5;
  document.getElementById('pDesc').value = p.description||'';
  document.getElementById('modalTitle').textContent = 'Edit Product';
  openModal('productModal');
}

async function saveProduct() {
  const name = document.getElementById('pName').value.trim();
  const price = document.getElementById('pPrice').value;
  const stock = document.getElementById('pStock').value;
  if (!name || !price || !stock) { showToast('Please fill in required fields', 'error'); return; }

  const item = {
    id: document.getElementById('pId').value || undefined,
    store_id: shopId, name,
    category: document.getElementById('pCategory').value,
    price: Number(price),
    stock: Number(stock),
    cost_price: Number(document.getElementById('pCost').value) || null,
    stock_alert: Number(document.getElementById('pAlert').value) || 5,
    description: document.getElementById('pDesc').value,
  };

  const { error } = await DB.products.save(item);
  if (error) { showToast('Error saving product: ' + error.message, 'error'); return; }
  showToast(item.id ? ' Product updated!' : ' Product added!', 'success');
  closeModal('productModal');
  products = await DB.products.getAll(shopId);
  renderProducts(); updateStats();
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await DB.products.delete(id);
  showToast('Product deleted', 'error');
  products = products.filter(p => p.id !== id);
  renderProducts(); updateStats();
}
</script>
</body>
</html>
