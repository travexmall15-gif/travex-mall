<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Products, ShopNekt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<link rel="stylesheet" href="shared.css"/>
<script src="/lang.js"></script>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
<div id="sidebar"></div>
<div class="main-wrapper">
  <div class="main-header">
    <div><div class="header-title" data-i18n="Products">Products</div><div class="header-sub" data-i18n="Manage your store products">Manage your store products</div></div>
    <div class="header-right">
      <button class="btn btn-gold" onclick="openModal()"><i class="ti ti-plus"></i> <span data-i18n="Add Product">Add Product</span></button>
    </div>
  </div>
  <div class="main-content">

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="stat-label" data-i18n="Total Products">Total Products</div><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="In Stock">In Stock</div><div class="stat-value" id="statInStock">0</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="Low Stock">Low Stock</div><div class="stat-value" id="statLow" style="color:#EF4444">0</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="Out of Stock">Out of Stock</div><div class="stat-value" id="statOut" style="color:#94A3B8">0</div></div>
    </div>

    <!-- Search + Filter -->
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:200px">
        <i class="ti ti-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94A3B8"></i>
        <input id="searchInput" oninput="filterProducts()" placeholder="Search products..." style="width:100%;padding:9px 12px 9px 36px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;outline:none;font-family:inherit"/>
      </div>
      <select id="catFilter" onchange="filterProducts()" style="padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:#fff">
        <option value="">All Categories</option>
        <option>Fashion & Clothing</option><option>Electronics</option>
        <option>Food & Groceries</option><option>Beauty & Health</option>
        <option>Agriculture</option><option>Services</option>
        <option>Home & Living</option><option>Sports & Fitness</option>
        <option>Education</option><option>Arts & Crafts</option>
      </select>
      <select id="stockFilter" onchange="filterProducts()" style="padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:#fff">
        <option value="">All Stock</option>
        <option value="in">In Stock</option>
        <option value="low">Low Stock (≤5)</option>
        <option value="out">Out of Stock</option>
      </select>
    </div>

    <!-- Products Grid -->
    <div id="productsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px"></div>
    <div id="emptyState" style="display:none;text-align:center;padding:4rem 0">
      <i class="ti ti-package" style="font-size:48px;color:#CBD5E1;display:block;margin-bottom:12px"></i>
      <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:1.2rem;font-weight:700;color:#0F172A;margin-bottom:8px" data-i18n="No products yet">No products yet</div>
      <p style="color:#94A3B8;font-size:14px;margin-bottom:20px" data-i18n="Add your first product to start selling">Add your first product to start selling</p>
      <button class="btn btn-gold" onclick="openModal()"><i class="ti ti-plus"></i> Add First Product</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="productModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="max-width:520px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h3 style="font-family:'Inter',sans-serif;font-weight:700;font-size:1.1rem;font-weight:800;color:#fff" id="modalTitle">Add Product</h3>
      <button onclick="closeModal()" style="background:rgba(255,255,255,0.08);border:none;border-radius:50%;width:32px;height:32px;color:rgba(255,255,255,0.6);cursor:pointer;font-size:18px">×</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group" style="grid-column:1/-1">
        <label class="form-label">Product Name *</label>
        <input class="form-control" id="pName" placeholder="e.g. Nike Air Max"/>
      </div>
      <div class="form-group">
        <label class="form-label">Price (TZS) *</label>
        <input class="form-control" id="pPrice" type="number" placeholder="45000"/>
      </div>
      <div class="form-group">
        <label class="form-label">Stock Quantity *</label>
        <input class="form-control" id="pStock" type="number" placeholder="10"/>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-control" id="pCategory">
          <option value="">Select category</option>
          <option>Fashion & Clothing</option><option>Electronics</option>
          <option>Food & Groceries</option><option>Beauty & Health</option>
          <option>Agriculture</option><option>Services</option>
          <option>Home & Living</option><option>Sports & Fitness</option>
          <option>Education</option><option>Arts & Crafts</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Image URL (optional)</label>
        <input class="form-control" id="pImage" placeholder="https://..."/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label class="form-label">Description</label>
        <textarea class="form-control" id="pDesc" rows="3" placeholder="Describe your product..."></textarea>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-gold" style="flex:1" id="saveBtn" onclick="saveProduct()">
        <i class="ti ti-device-floppy"></i> Save Product
      </button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="dashboard.js"></script>
<script src="aria-engine.js"></script>
<script src="aria-widget.js"></script>
<script src="i18n.js"></script>
<script>
let allProducts = []
let editingId = null
const fmt = n => 'TZS ' + Number(n||0).toLocaleString('en-US')

async function loadData() {
  Auth.requireAuth()
  const session = JSON.parse(localStorage.getItem('travex_session') || '{}')
  const storeId = session?.id
  if (!storeId) return

  const isCampus = session.market === 'campus'
  const table  = isCampus ? 'campus_products' : 'products'
  const idCol  = isCampus ? 'store_id'        : 'shop_id'

  const { data, error } = await sb.from(table)
    .select('*').eq(idCol, storeId).order('created_at', { ascending: false })

  if (error) { showToast('Error loading products: ' + error.message); return }
  allProducts = data || []
  renderProducts(allProducts)
  updateStats(allProducts)
  document.getElementById('loadingOverlay').style.display = 'none'
}

function updateStats(products) {
  document.getElementById('statTotal').textContent = products.length
  document.getElementById('statInStock').textContent = products.filter(p=>p.stock>5).length
  document.getElementById('statLow').textContent = products.filter(p=>p.stock>0&&p.stock<=5).length
  document.getElementById('statOut').textContent = products.filter(p=>p.stock===0).length
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase()
  const cat = document.getElementById('catFilter').value
  const stock = document.getElementById('stockFilter').value
  let filtered = allProducts.filter(p => {
    const matchQ = !q || p.name?.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q)
    const matchCat = !cat || p.category === cat
    const matchStock = !stock ||
      (stock === 'in' && p.stock > 5) ||
      (stock === 'low' && p.stock > 0 && p.stock <= 5) ||
      (stock === 'out' && p.stock === 0)
    return matchQ && matchCat && matchStock
  })
  renderProducts(filtered)
}

function renderProducts(products) {
  const grid = document.getElementById('productsGrid')
  const empty = document.getElementById('emptyState')
  if (!products.length) { grid.style.display = 'none'; empty.style.display = 'block'; return }
  grid.style.display = 'grid'; empty.style.display = 'none'
  grid.innerHTML = products.map(p => {
    const stockColor = p.stock === 0 ? '#EF4444' : p.stock <= 5 ? '#F97316' : '#22C55E'
    const stockLabel = p.stock === 0 ? 'Out of Stock' : p.stock <= 5 ? `${p.stock} left` : `${p.stock} in stock`
    return `
    <div style="background:#fff;border:1.5px solid #E2E8F4;border-radius:14px;overflow:hidden;transition:all .2s" onmouseover="this.style.boxShadow='0 8px 24px rgba(13,27,62,.10)'" onmouseout="this.style.boxShadow='none'">
      <div style="height:80px;background:${p.image_url?`url(${p.image_url}) center/cover`:'linear-gradient(135deg,#0D1B3E,#1B3A8A)'};position:relative">
        ${!p.image_url ? `<i class="ti ti-package" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:rgba(255,255,255,.3)"></i>` : ''}
        <span style="position:absolute;top:6px;right:6px;background:${stockColor};color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px">${stockLabel}</span>
      </div>
      <div style="padding:10px 12px 12px">
        <div style="font-weight:700;font-size:13px;color:#0F172A;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
        <div style="font-size:11px;color:#94A3B8;margin-bottom:6px">${p.category||'General'}</div>
        <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:15px;font-weight:900;color:#0D1B3E;margin-bottom:8px">${fmt(p.price)}</div>
        <div style="display:flex;gap:6px">
          <button onclick="editProduct('${p.id}')" style="flex:1;padding:5px;background:#F8FAFF;border:1px solid #E2E8F4;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:#0D1B3E" title="Edit">
            <i class="ti ti-edit"></i> Edit
          </button>
          <button onclick="deleteProduct('${p.id}')" style="padding:5px 8px;background:#FFF1F1;border:1px solid #FECACA;border-radius:8px;font-size:11px;cursor:pointer;color:#EF4444" title="Delete">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </div>
    </div>`
  }).join('')
}

function openModal(product=null) {
  editingId = product?.id || null
  document.getElementById('modalTitle').textContent = product ? 'Edit Product' : 'Add Product'
  document.getElementById('pName').value = product?.name || ''
  document.getElementById('pPrice').value = product?.price || ''
  document.getElementById('pStock').value = product?.stock || ''
  document.getElementById('pCategory').value = product?.category || ''
  document.getElementById('pDesc').value = product?.description || ''
  document.getElementById('pImage').value = product?.image_url || ''
  document.getElementById('productModal').style.display = 'flex'
  setTimeout(() => document.getElementById('pName').focus(), 100)
}

function closeModal() { document.getElementById('productModal').style.display = 'none'; editingId = null }

function editProduct(id) {
  const p = allProducts.find(x => x.id === id)
  if (p) openModal(p)
}

async function saveProduct() {
  const name = document.getElementById('pName').value.trim()
  const price = parseFloat(document.getElementById('pPrice').value)
  const stock = parseInt(document.getElementById('pStock').value)
  if (!name || isNaN(price) || isNaN(stock)) { showToast('Please fill in all required fields'); return }

  const session = JSON.parse(localStorage.getItem('travex_session') || '{}')
  const btn = document.getElementById('saveBtn')
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i> Saving...'
  btn.disabled = true

  const isCampus = session.market === 'campus'
  const table    = isCampus ? 'campus_products' : 'products'
  const idCol    = isCampus ? 'store_id'        : 'shop_id'

  const payload = {
    [idCol]: session.id,
    name, price, stock,
    category: document.getElementById('pCategory').value,
    description: document.getElementById('pDesc').value.trim(),
    image_url: document.getElementById('pImage').value.trim() || null,
    updated_at: new Date().toISOString(),
  }

  let error
  if (editingId) {
    ;({ error } = await sb.from(table).update(payload).eq('id', editingId))
  } else {
    payload.created_at = new Date().toISOString()
    ;({ error } = await sb.from(table).insert(payload))
  }

  btn.innerHTML = '<i class="ti ti-device-floppy"></i> Save Product'
  btn.disabled = false

  if (error) { showToast('Error saving product: ' + error.message); return }
  showToast(editingId ? 'Product updated!' : 'Product added!')
  closeModal()
  loadData()
}

async function deleteProduct(id) {
  if (!confirm('Delete this product? This cannot be undone.')) return
  const session  = JSON.parse(localStorage.getItem('travex_session') || '{}')
  const isCampus = session.market === 'campus'
  const table    = isCampus ? 'campus_products' : 'products'
  const { error } = await sb.from(table).delete().eq('id', id)
  if (error) { showToast('Error deleting product'); return }
  showToast('Product deleted')
  loadData()
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3000)
}

document.addEventListener('DOMContentLoaded', loadData)
</script>
</body>
</html>
