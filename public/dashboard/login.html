<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — ShopNekt Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#060B18 0%,#0D1B3E 60%,#071540 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.28)}
.logo-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.logo-row img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.brand{font-size:1.2rem;font-weight:800;color:#0D1B3E;letter-spacing:-0.03em}
.brand span{color:#C9A84C}
h1{font-weight:800;font-size:1.4rem;color:#0D1B3E;text-align:center;margin-bottom:5px}
.sub{font-size:13px;color:#64748B;text-align:center;margin-bottom:24px;line-height:1.5}
.error-box{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:14px;display:none}
.success-box{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:14px;display:none}
.form-group{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase}
.input-wrap{position:relative}
.input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem}
input{width:100%;padding:13px 14px 13px 42px;border:2px solid #E2E8F0;border-radius:12px;font-size:1rem;font-family:'Inter',sans-serif;color:#0F172A;outline:none;transition:all 0.2s;font-weight:600}
input:focus{border-color:#0D1B3E;box-shadow:0 0 0 3px rgba(13,27,62,0.08)}
input::placeholder{font-weight:400;color:#94A3B8;font-size:0.88rem}
.hint{font-size:11px;color:#94A3B8;margin-top:5px;padding-left:2px}
.btn-login{width:100%;padding:14px;background:#0D1B3E;color:#C9A84C;border:none;border-radius:12px;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;margin-top:6px;letter-spacing:0.02em}
.btn-login:hover{background:#1B3A8A;transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,27,62,0.25)}
.btn-login:disabled{opacity:0.6;cursor:wait;transform:none}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#94A3B8;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#E2E8F0}
.btn-secondary{width:100%;padding:11px;background:#F8FAFF;color:#0D1B3E;border:1.5px solid #E2E8F0;border-radius:12px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.btn-secondary:hover{border-color:#0D1B3E;background:#EEF2FF}
.footer-links{margin-top:20px;text-align:center;font-size:12px;color:rgba(255,255,255,0.4)}
.footer-links a{color:#C9A84C;text-decoration:none;font-weight:600}
.lang-toggle{position:fixed;top:16px;right:16px;display:flex;gap:4px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:999px;padding:3px;z-index:999}
.lang-btn{padding:4px 12px;border-radius:999px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:700;background:transparent;color:rgba(255,255,255,0.5);transition:all .2s}
.lang-btn.active{background:#fff;color:#0D1B3E}

/* PIN dots display */
.pin-dots{display:flex;justify-content:center;gap:14px;margin:20px 0 8px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid #CBD5E1;transition:all 0.2s}
.pin-dot.filled{background:#0D1B3E;border-color:#0D1B3E;transform:scale(1.1)}

/* PIN keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{padding:16px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:14px;font-size:1.2rem;font-weight:700;color:#0F172A;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Inter',sans-serif;user-select:none}
.key:hover{background:#EEF2FF;border-color:#0D1B3E}
.key:active{transform:scale(0.94);background:#E2E8F0}
.key.del{color:#EF4444;font-size:1rem}
.key.empty{background:transparent;border-color:transparent;cursor:default}

.who-badge{display:flex;align-items:center;gap:10px;background:#F1F5F9;border-radius:12px;padding:10px 14px;margin-bottom:20px}
.who-badge .avatar{width:36px;height:36px;border-radius:10px;background:#0D1B3E;color:#C9A84C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.who-badge .info{flex:1}
.who-badge .name{font-weight:700;color:#0F172A;font-size:0.9rem}
.who-badge .email{font-size:0.72rem;color:#94A3B8}
.who-badge .change{font-size:0.72rem;color:#3B82F6;cursor:pointer;font-weight:600}

/* Screens */
#screenFirst, #screenPin{display:none}
</style>
</head>
<body>

<div class="lang-toggle">
  <button class="lang-btn active" data-lang="en" onclick="toggleLang('en')">EN</button>
  <button class="lang-btn" data-lang="sw" onclick="toggleLang('sw')">SW</button>
</div>

<div class="card">
  <div class="logo-row">
    <img src="/icon-192.png" alt="ShopNekt"/>
    <span class="brand">shop<span>nekt</span></span>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <!-- ══ SCREEN 1: First time — Email + PIN ══ -->
  <div id="screenFirst">
    <h1>👋 <span data-en="Welcome Back" data-sw="Karibu Tena">Welcome Back</span></h1>
    <p class="sub" data-en="Enter your email and PIN to sign in" data-sw="Ingiza email na PIN yako kuingia">Enter your email and PIN to sign in</p>

    <div class="form-group">
      <label data-en="EMAIL ADDRESS" data-sw="BARUA PEPE">EMAIL ADDRESS</label>
      <div class="input-wrap">
        <span class="icon">✉️</span>
        <input type="email" id="emailInput"
          placeholder="your@email.com"
          autocomplete="email"
          onkeydown="if(event.key==='Enter')goToPinScreen()"/>
      </div>
    </div>

    <button class="btn-login" onclick="goToPinScreen()">
      <span data-en="Continue →" data-sw="Endelea →">Continue →</span>
    </button>

    <div class="divider"><span data-en="or" data-sw="au">or</span></div>
    <button class="btn-secondary" onclick="window.location.href='reset-pin.html'">
      <span data-en="🔄 Forgot PIN? Reset here" data-sw="🔄 Umesahau PIN? Reset hapa">🔄 Forgot PIN? Reset here</span>
    </button>
  </div>

  <!-- ══ SCREEN 2: PIN entry (keypad) ══ -->
  <div id="screenPin">
    <!-- Who is logging in -->
    <div class="who-badge" id="whoBadge">
      <div class="avatar" id="whoAvatar">J</div>
      <div class="info">
        <div class="name" id="whoName">Loading...</div>
        <div class="email" id="whoEmail"></div>
      </div>
      <div class="change" onclick="switchAccount()"
        data-en="Not you?" data-sw="Si wewe?">Not you?</div>
    </div>

    <h1 data-en="Enter Your PIN" data-sw="Ingiza PIN Yako">Enter Your PIN</h1>
    <p class="sub" data-en="4-digit PIN you created during registration" data-sw="PIN ya namba 4 uliyoweka wakati wa kujiandikisha">4-digit PIN you created during registration</p>

    <!-- PIN dots -->
    <div class="pin-dots">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
    </div>
    <p class="hint" style="text-align:center" id="pinHint"></p>

    <!-- Keypad -->
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key empty"></button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key del" onclick="deleteLast()">⌫</button>
    </div>
  </div>
</div>

<div class="footer-links">
  <a href="/">← Rudi ShopNekt</a> &nbsp;·&nbsp;
  <a href="/open-store">Fungua Duka Jipya</a>
</div>

<script>
const SB_URL = 'https://bscecjbgnjitlfmgwcic.supabase.co'
const SB_KEY = 'sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos'
const SESSION_KEY = 'travex_session'
const EMAIL_KEY   = 'travex_email'

let pinValue = ''
let currentEmail = ''

// ── Helpers ────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorBox')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('successBox').style.display = 'none'
  // Shake animation
  const card = el.closest ? el.closest('.card') : document.querySelector('.card')
  card.style.animation = 'none'
  setTimeout(() => card.style.animation = '', 10)
}
function showSuccess(msg) {
  const el = document.getElementById('successBox')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('errorBox').style.display = 'none'
}
function clearMessages() {
  document.getElementById('errorBox').style.display = 'none'
  document.getElementById('successBox').style.display = 'none'
}

// ── Determine which screen to show ────────────────────
async function init() {
  try {
    // Check for valid existing session
    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}')
    if (session?.id) {
      try {
        const res = await fetch(
          `${SB_URL}/rest/v1/pending_payments?id=eq.${session.id}&status=eq.approved&select=id`,
          { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } }
        )
        const data = await res.json()
        if (data && data.length) {
          window.location.href = 'dashboard.html'
          return
        }
      } catch(e) { /* ignore network errors */ }
      // Stale session — clear it
      localStorage.removeItem(SESSION_KEY)
      localStorage.removeItem(EMAIL_KEY)
    }

    // Check if email was remembered
    const savedEmail = localStorage.getItem(EMAIL_KEY)
    if (savedEmail) {
      showPinScreen(savedEmail)
    } else {
      document.getElementById('screenFirst').style.display = 'block'
    }
  } catch(e) {
    // Always fallback to email screen
    document.getElementById('screenFirst').style.display = 'block'
  }
}
// ── Start ───────────────────────────────────────────────
init()
</script>

<script>
// Language toggle
const LANG_KEY='sn_lang'
let currentLang=localStorage.getItem(LANG_KEY)||'en'
function applyLang(lang){
  currentLang=lang;localStorage.setItem(LANG_KEY,lang)
  document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=lang==='sw'?(el.dataset.sw||el.dataset.en):el.dataset.en})
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))
}
function toggleLang(lang){applyLang(lang)}
document.addEventListener('DOMContentLoaded',()=>applyLang(currentLang))
</script>
</body>
</html>
