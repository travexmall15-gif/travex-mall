<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — ShopNekt Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#060B18 0%,#0D1B3E 60%,#071540 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
body.rtl{direction:rtl;font-family:'Cairo','Inter',sans-serif}
.card{background:#fff;border-radius:24px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.28)}
.logo-row{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.logo-row img{width:36px;height:36px;border-radius:10px;object-fit:cover;margin-right:8px}
body.rtl .logo-row img{margin-right:0;margin-left:8px}
.brand{font-size:1.2rem;font-weight:900;color:#0D1B3E;letter-spacing:-0.03em}
.brand em{font-style:normal;color:#C9A84C}
h1{font-weight:800;font-size:1.35rem;color:#0D1B3E;text-align:center;margin-bottom:5px}
.sub{font-size:13px;color:#64748B;text-align:center;margin-bottom:22px;line-height:1.5}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:12px;display:none}
.ok{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:12px;display:none}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;letter-spacing:0.05em;text-transform:uppercase}
.iw{position:relative}
.iw i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;font-size:1rem;pointer-events:none}
body.rtl .iw i{left:auto;right:13px}
input[type=email]{width:100%;padding:12px 12px 12px 40px;border:2px solid #E2E8F0;border-radius:12px;font-size:0.95rem;font-family:inherit;color:#0F172A;outline:none;transition:border-color .2s;font-weight:500;background:#fff}
body.rtl input[type=email]{padding:12px 40px 12px 12px;text-align:right}
input[type=email]:focus{border-color:#0D1B3E;box-shadow:0 0 0 3px rgba(13,27,62,.08)}
input[type=email]::placeholder{font-weight:400;color:#94A3B8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:4px}
.btn-main{background:#0D1B3E;color:#C9A84C}
.btn-main:hover{background:#1B3A8A}
.btn-main:active{transform:scale(.98)}
.btn-sec{background:#F8FAFF;color:#0D1B3E;border:1.5px solid #E2E8F0;font-weight:600;font-size:.85rem;margin-top:10px}
.btn-sec:hover{border-color:#0D1B3E;background:#EEF2FF}
.div{display:flex;align-items:center;gap:10px;margin:12px 0;color:#94A3B8;font-size:12px}
.div::before,.div::after{content:'';flex:1;height:1px;background:#E2E8F0}
/* PIN */
.who{display:flex;align-items:center;gap:10px;background:#F1F5F9;border-radius:12px;padding:10px 14px;margin-bottom:18px}
.av{width:34px;height:34px;border-radius:10px;background:#0D1B3E;color:#C9A84C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
.wi{flex:1;min-width:0}
.wn{font-weight:700;color:#0F172A;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.we{font-size:.7rem;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{font-size:.7rem;color:#3B82F6;cursor:pointer;font-weight:600;flex-shrink:0}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.dot{width:17px;height:17px;border-radius:50%;border:2.5px solid #CBD5E1;transition:all .15s}
.dot.on{background:#0D1B3E;border-color:#0D1B3E;transform:scale(1.12)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.k{padding:16px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:13px;font-size:1.2rem;font-weight:700;color:#0F172A;cursor:pointer;text-align:center;transition:all .12s;font-family:inherit;user-select:none;border:none;border:1.5px solid #E2E8F0}
.k:hover{background:#EEF2FF;border-color:#0D1B3E}
.k:active{transform:scale(.93)}
.k.del{color:#EF4444;font-size:1rem}
.k.empty{background:transparent;border-color:transparent;pointer-events:none}
/* Lang */
.lt{position:fixed;top:12px;right:12px;display:flex;gap:3px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;z-index:999}
body.rtl .lt{right:auto;left:12px}
.lb{padding:3px 9px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-size:.64rem;font-weight:700;background:transparent;color:rgba(255,255,255,.5);transition:all .18s}
.lb.on{background:#fff;color:#0D1B3E}
/* Footer */
.fl{margin-top:18px;text-align:center;font-size:12px;color:rgba(255,255,255,.38)}
.fl a{color:#C9A84C;text-decoration:none;font-weight:600}
/* Hidden */
.hide{display:none!important}
</style>
</head>
<body>

<!-- Language toggle -->
<div class="lt">
  <button class="lb" data-l="en"  onclick="L('en')">🇬🇧 EN</button>
  <button class="lb" data-l="sw"  onclick="L('sw')">🇹🇿 SW</button>
  <button class="lb" data-l="fr"  onclick="L('fr')">🇫🇷 FR</button>
  <button class="lb" data-l="de"  onclick="L('de')">🇩🇪 DE</button>
  <button class="lb" data-l="pt"  onclick="L('pt')">🇵🇹 PT</button>
  <button class="lb" data-l="ar"  onclick="L('ar')">🇸🇦 AR</button>
</div>

<div class="card">
  <div class="logo-row">
    <img src="/sn-logo.png" alt="ShopNekt"/>
    <span class="brand">Shop<em>Nekt</em></span>
  </div>

  <div class="err" id="err"></div>
  <div class="ok"  id="ok"></div>

  <!-- ── Screen 1: Email ── -->
  <div id="s1">
    <h1 id="i-welcome">👋 Welcome Back</h1>
    <p class="sub" id="i-sub">Enter your email and PIN to access your dashboard</p>
    <div class="fg">
      <label id="i-label">EMAIL ADDRESS</label>
      <div class="iw">
        <i>✉️</i>
        <input type="email" id="eml" placeholder="your@email.com"
          autocomplete="email" inputmode="email"
          onkeydown="if(event.key==='Enter'){event.preventDefault();go()}"/>
      </div>
    </div>
    <button class="btn btn-main" onclick="go()" id="btn-go">
      <span id="i-go">Continue →</span>
    </button>
    <div class="div"><span id="i-or">or</span></div>
    <button class="btn btn-sec" onclick="location.href='reset-pin.html'">
      <span id="i-reset">🔄 Forgot PIN? Reset here</span>
    </button>
  </div>

  <!-- ── Screen 2: PIN ── -->
  <div id="s2" class="hide">
    <div class="who">
      <div class="av" id="av">J</div>
      <div class="wi">
        <div class="wn" id="wn">ShopNekt Seller</div>
        <div class="we" id="we"></div>
      </div>
      <div class="wc" onclick="back()" id="i-back2">Not you?</div>
    </div>
    <h1 id="i-pin">Enter Your PIN</h1>
    <p class="sub" id="i-pinsub">4-digit PIN from your registration</p>
    <div class="dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div class="kp">
      <button class="k" onclick="pk('1')">1</button>
      <button class="k" onclick="pk('2')">2</button>
      <button class="k" onclick="pk('3')">3</button>
      <button class="k" onclick="pk('4')">4</button>
      <button class="k" onclick="pk('5')">5</button>
      <button class="k" onclick="pk('6')">6</button>
      <button class="k" onclick="pk('7')">7</button>
      <button class="k" onclick="pk('8')">8</button>
      <button class="k" onclick="pk('9')">9</button>
      <button class="k empty"></button>
      <button class="k" onclick="pk('0')">0</button>
      <button class="k del" onclick="del()">⌫</button>
    </div>
  </div>
</div>

<div class="fl">
  <a href="/" id="i-home">← Back to ShopNekt</a> &nbsp;·&nbsp;
  <a href="/open-store" id="i-new">Open a New Shop</a>
</div>

<script>
// ── Config ───────────────────────────────────────────────────
var SB  = 'https://bscecjbgnjitlfmgwcic.supabase.co'
var KEY = 'sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos'
var SESS_K = 'travex_session'
var MAIL_K = 'travex_email'
var LANG_K = 'travex_lang'

var pin = ''
var email = ''

// ── Translations ─────────────────────────────────────────────
var TR = {
  en:{welcome:'👋 Welcome Back',sub:'Enter your email and PIN to access your dashboard',
      label:'EMAIL ADDRESS',go:'Continue →',or:'or',reset:'🔄 Forgot PIN? Reset here',
      back2:'Not you?',pinH:'Enter Your PIN',pinS:'4-digit PIN from your registration',
      home:'← Back to ShopNekt',newShop:'Open a New Shop',
      errEmail:'Please enter your email address.',errPin:'Wrong PIN. Try again.',
      errNet:'Network error. Check your connection.',
      errShop:'No shop found with this email. Check your email or open a new shop.',
      errPending:'Your shop is under review. We will notify you once approved (usually within 30 minutes).',
      errRejected:'Your application was not approved. Please contact ShopNekt support.',
      loading:'Verifying...'},
  sw:{welcome:'👋 Karibu Tena',sub:'Ingiza email na PIN yako kufikia dashibodi yako',
      label:'BARUA PEPE',go:'Endelea →',or:'au',reset:'🔄 Umesahau PIN? Reset hapa',
      back2:'Si wewe?',pinH:'Ingiza PIN Yako',pinS:'PIN ya namba 4 kutoka usajili wako',
      home:'← Rudi ShopNekt',newShop:'Fungua Duka Jipya',
      errEmail:'Tafadhali ingiza anwani ya barua pepe.',errPin:'PIN si sahihi. Jaribu tena.',
      errNet:'Hitilafu ya mtandao. Angalia muunganisho.',
      errShop:'Hakuna duka lililofunguliwa kwa email hii. Angalia email yako au fungua duka jipya.',
      errPending:'Duka lako linapitiwa na timu yetu. Tutakuarifu ukikubaliwa (kawaida ndani ya dakika 30).',
      errRejected:'Ombi lako halijakubaliwa. Tafadhali wasiliana na msaada wa ShopNekt.',
      loading:'Inathibitisha...'},
  fr:{welcome:'👋 Bon retour',sub:'Entrez votre e-mail et PIN pour accéder au tableau de bord',
      label:'ADRESSE E-MAIL',go:'Continuer →',or:'ou',reset:'🔄 PIN oublié ? Réinitialiser',
      back2:"Ce n'est pas vous ?",pinH:'Entrez votre PIN',pinS:"PIN à 4 chiffres de l'inscription",
      home:'← Retour à ShopNekt',newShop:'Ouvrir une nouvelle boutique',
      errEmail:'Veuillez saisir votre adresse e-mail.',errPin:'PIN incorrect. Réessayez.',
      errNet:'Erreur réseau. Vérifiez votre connexion.',errShop:"Aucune boutique trouvée avec cet e-mail. Vérifiez ou ouvrez une nouvelle boutique.",
      errPending:"Votre boutique est en cours d'examen. Vous serez notifié à l'approbation (environ 30 min).",
      errRejected:"Votre candidature n'a pas été approuvée. Contactez ShopNekt.",
      loading:'Vérification...'},
  de:{welcome:'👋 Willkommen zurück',sub:'E-Mail und PIN eingeben für das Dashboard',
      label:'E-MAIL-ADRESSE',go:'Weiter →',or:'oder',reset:'🔄 PIN vergessen? Hier zurücksetzen',
      back2:'Nicht Sie?',pinH:'PIN eingeben',pinS:'4-stellige PIN aus der Registrierung',
      home:'← Zurück zu ShopNekt',newShop:'Neuen Shop eröffnen',
      errEmail:'Bitte E-Mail-Adresse eingeben.',errPin:'Falscher PIN. Erneut versuchen.',
      errNet:'Netzwerkfehler. Verbindung prüfen.',errShop:'Shop nicht gefunden. Prüfen Sie Ihre E-Mail oder eröffnen Sie einen neuen Shop.',
      errPending:'Ihr Shop wird geprüft. Wir benachrichtigen Sie bei Genehmigung (ca. 30 Minuten).',
      errRejected:'Ihre Bewerbung wurde nicht genehmigt. Bitte kontaktieren Sie ShopNekt.',
      loading:'Verifizierung...'},
  pt:{welcome:'👋 Bem-vindo de volta',sub:'Digite seu e-mail e PIN para acessar o painel',
      label:'ENDEREÇO DE E-MAIL',go:'Continuar →',or:'ou',reset:'🔄 Esqueceu o PIN? Redefinir',
      back2:'Não é você?',pinH:'Digite seu PIN',pinS:'PIN de 4 dígitos do registro',
      home:'← Voltar ao ShopNekt',newShop:'Abrir nova loja',
      errEmail:'Por favor, insira seu e-mail.',errPin:'PIN incorreto. Tente novamente.',
      errNet:'Erro de rede. Verifique sua conexão.',errShop:'Nenhuma loja encontrada com este e-mail. Verifique ou abra uma nova loja.',
      errPending:'Sua loja está em análise. Notificaremos você quando aprovada (geralmente em 30 min).',
      errRejected:'Seu pedido não foi aprovado. Contate o suporte ShopNekt.',
      loading:'Verificando...'},
  ar:{welcome:'👋 أهلاً بعودتك',sub:'أدخل بريدك الإلكتروني ورمز PIN للوصول إلى لوحة التحكم',
      label:'البريد الإلكتروني',go:'متابعة ←',or:'أو',reset:'🔄 نسيت PIN؟ أعِد التعيين',
      back2:'لست أنت؟',pinH:'أدخل رمز PIN',pinS:'رمز PIN المكوّن من 4 أرقام',
      home:'العودة إلى ShopNekt ←',newShop:'فتح متجر جديد',
      errEmail:'الرجاء إدخال عنوان البريد الإلكتروني.',errPin:'رمز PIN غير صحيح. حاول مرة أخرى.',
      errNet:'خطأ في الشبكة. تحقق من الاتصال.',errShop:'لم يتم العثور على متجر بهذا البريد. تحقق من بريدك أو افتح متجراً جديداً.',
      errPending:'متجرك قيد المراجعة. سنخطرك عند الموافقة (عادةً خلال 30 دقيقة).',
      errRejected:'لم تتم الموافقة على طلبك. تواصل مع دعم ShopNekt.',
      loading:'جارٍ التحقق...'}
}

// ── Language ──────────────────────────────────────────────────
var lang = localStorage.getItem(LANG_K) || 'en'

function t(k){ return (TR[lang]||TR.en)[k] || k }

function L(l){
  lang = l
  localStorage.setItem(LANG_K, l)
  var isRTL = (l === 'ar')
  document.body.classList.toggle('rtl', isRTL)
  document.documentElement.lang = l
  // Update all text
  setText('i-welcome', t('welcome'))
  setText('i-sub',     t('sub'))
  setText('i-label',   t('label'))
  setText('i-go',      t('go'))
  setText('i-or',      t('or'))
  setText('i-reset',   t('reset'))
  setText('i-back2',   t('back2'))
  setText('i-pin',     t('pinH'))
  setText('i-pinsub',  t('pinS'))
  setText('i-home',    t('home'))
  setText('i-new',     t('newShop'))
  var eml = document.getElementById('eml')
  if(eml) eml.placeholder = (l==='ar') ? 'بريدك@الإلكتروني.com' : 'your@email.com'
  // Toggle active button
  document.querySelectorAll('.lb').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-l')===l)
  })
  // Fire event for Next.js
  window.dispatchEvent(new CustomEvent('shopnekt-lang',{detail:l}))
}

function setText(id, val){
  var el = document.getElementById(id)
  if(el) el.textContent = val
}

// ── UI helpers ────────────────────────────────────────────────
function showErr(msg){ var e=document.getElementById('err'); e.textContent=msg; e.style.display='block'; document.getElementById('ok').style.display='none' }
function showOk(msg) { var o=document.getElementById('ok');  o.textContent=msg; o.style.display='block'; document.getElementById('err').style.display='none' }
function clr()       { document.getElementById('err').style.display='none'; document.getElementById('ok').style.display='none' }

// ── Screen 1 → 2: Continue ───────────────────────────────────
async function go(){
  var v = document.getElementById('eml').value.trim()
  if(!v){ showErr(t('errEmail')); return }
  clr()
  email = v
  localStorage.setItem(MAIL_K, v)

  // Tafuta jina la duka mapema (kuonyesha kwenye PIN screen)
  var shopName = 'ShopNekt Seller'
  try {
    var h = { 'apikey': KEY, 'Authorization': 'Bearer '+KEY }
    var enc = encodeURIComponent(v)
    var r = await fetch(SB+'/rest/v1/pending_payments?auth_email=eq.'+enc+'&select=shop_name,status', {headers:h})
    var d = await r.json()
    if(!d||!d.length){
      r = await fetch(SB+'/rest/v1/pending_payments?owner_email=eq.'+enc+'&select=shop_name,status', {headers:h})
      d = await r.json()
    }
    if(d&&d.length){
      shopName = d[0].shop_name || shopName
      // Onyesha onyo kama bado inapitiwa
      if(d[0].status==='pending'){
        showErr(t('errPending'))
        return
      }
      if(d[0].status==='rejected'){
        showErr(t('errRejected'))
        return
      }
    } else {
      showErr(t('errShop'))
      return
    }
  } catch(e){ /* network error — endelea tu */ }

  // Onyesha PIN screen
  document.getElementById('s1').classList.add('hide')
  document.getElementById('s2').classList.remove('hide')
  document.getElementById('av').textContent = shopName.slice(0,2).toUpperCase()
  document.getElementById('we').textContent = v
  document.getElementById('wn').textContent = shopName
  pin = ''
  dots()
}

// ── Screen 2 → 1: Back ───────────────────────────────────────
function back(){
  localStorage.removeItem(MAIL_K)
  pin = ''; dots(); clr()
  document.getElementById('s2').classList.add('hide')
  document.getElementById('s1').classList.remove('hide')
  document.getElementById('eml').value = ''
}

// ── PIN keypad ────────────────────────────────────────────────
function pk(k){
  if(pin.length>=4) return
  pin+=k; dots()
  if(pin.length===4) setTimeout(submit,120)
}
function del(){ pin=pin.slice(0,-1); dots() }
function dots(){
  for(var i=0;i<4;i++)
    document.getElementById('d'+i).classList.toggle('on', i<pin.length)
}

// ── Submit PIN ────────────────────────────────────────────────
async function submit(){
  clr()
  var keys = document.querySelectorAll('.k')
  keys.forEach(function(k){ k.disabled=true })

  try {
    var h = { 'apikey': KEY, 'Authorization': 'Bearer '+KEY }
    var enc = encodeURIComponent(email)
    // Select status too — tuchunguze baada ya kupata shop
    var sel = 'select=id,shop_name,login_password,status'

    // Tafuta kwa auth_email kwanza (v2 form), kisha owner_email (forms za zamani)
    var data = null
    var r = await fetch(SB+'/rest/v1/pending_payments?auth_email=eq.'+enc+'&'+sel, {headers:h})
    data = await r.json()
    if(!data || !data.length){
      r = await fetch(SB+'/rest/v1/pending_payments?owner_email=eq.'+enc+'&'+sel, {headers:h})
      data = await r.json()
    }

    var shop = data && data[0]

    // Hakuna duka kabisa
    if(!shop){
      showErr(t('errShop'))
      pin=''; dots()
      keys.forEach(function(k){ k.disabled=false })
      return
    }

    // Duka lipo — angalia hali yake kwanza
    if(shop.status === 'pending'){
      showErr(t('errPending'))
      pin=''; dots()
      keys.forEach(function(k){ k.disabled=false })
      return
    }

    if(shop.status === 'rejected'){
      showErr(t('errRejected'))
      pin=''; dots()
      keys.forEach(function(k){ k.disabled=false })
      return
    }

    // Status ni approved — angalia PIN
    var stored = (shop.login_password||'').toString()
    var match  = stored===pin || stored.endsWith('-'+pin) || stored.startsWith(pin+'-') || stored.split('-').pop()===pin
    if(!match){
      showErr(t('errPin'))
      pin=''; dots()
      keys.forEach(function(k){ k.disabled=false })
      return
    }

    // Login imefanikiwa
    showOk(t('loading'))
    document.getElementById('wn').textContent = shop.shop_name || 'Seller'
    localStorage.removeItem(MAIL_K)
    localStorage.setItem(SESS_K, JSON.stringify({id:shop.id, market:'business', shop_name:shop.shop_name}))
    setTimeout(function(){ location.href='dashboard.html' }, 700)

  } catch(e){
    showErr(t('errNet'))
    pin=''; dots()
    keys.forEach(function(k){ k.disabled=false })
  }
}

// ── Init ──────────────────────────────────────────────────────
window.onload = function(){
  // Apply saved language
  L(lang)

  // Check existing session
  try{
    var sess = JSON.parse(localStorage.getItem(SESS_K)||'{}')
    if(sess && sess.id){
      // Quick verify
      fetch(SB+'/rest/v1/pending_payments?id=eq.'+sess.id+'&select=id,status',
        {headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
        .then(function(r){ return r.json() })
        .then(function(d){
          if(d&&d.length&&d[0].status==='approved'){ location.href='dashboard.html' }
          else { localStorage.removeItem(SESS_K); checkEmail() }
        }).catch(checkEmail)
    } else { checkEmail() }
  } catch(e){ checkEmail() }
}

function checkEmail(){
  var saved = localStorage.getItem(MAIL_K)
  // Always show email screen — pre-fill if saved
  // (prevents PIN-loop when session is invalidated)
  document.getElementById('s1').classList.remove('hide')
  if(saved){
    document.getElementById('eml').value = saved
    email = saved
  }
}
</script>
</body>
</html>
