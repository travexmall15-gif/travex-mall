<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — ShopNekt Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#060B18 0%,#0D1B3E 50%,#071540 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.card{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.24)}

.logo-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.logo-row img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.brand{font-family:'Inter',sans-serif;font-size:1.25rem;font-weight:700;color:#0D1B3E;letter-spacing:-0.03em}
.brand span{color:#C9A84C}

h1{font-family:'Inter',sans-serif;font-weight:700;font-size:1.5rem;font-weight:800;color:#0D1B3E;text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:#64748B;text-align:center;margin-bottom:28px;line-height:1.5}

.form-group{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;letter-spacing:0.02em}
input{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:12px;font-size:0.95rem;font-family:'Inter',sans-serif;color:#0F172A;outline:none;transition:all 0.2s;letter-spacing:0.05em;text-align:center;font-weight:700;font-size:1.1rem}
input:focus{border-color:#0D1B3E;box-shadow:0 0 0 3px rgba(13,27,62,0.08)}
input::placeholder{font-size:0.85rem;color:#94A3B8;font-weight:400;letter-spacing:normal}

.hint{font-size:11px;color:#94A3B8;margin-top:6px;text-align:center}
.hint strong{color:#0D1B3E}

.btn-login{width:100%;padding:14px;background:#0D1B3E;color:#fff;border:none;border-radius:12px;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;margin-top:8px;letter-spacing:0.02em}
.btn-login:hover{background:#1B3A8A;transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,27,62,0.25)}
.btn-login:disabled{opacity:0.6;cursor:wait;transform:none}

.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#94A3B8;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#E2E8F0}

.btn-reset{width:100%;padding:11px;background:#F8FAFF;color:#0D1B3E;border:1.5px solid #E2E8F0;border-radius:12px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.btn-reset:hover{border-color:#0D1B3E;background:#EEF2FF}

.error-box{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:14px;display:none}
.success-box{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A;padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:14px;display:none}

.pin-format{background:linear-gradient(135deg,#0D1B3E,#1B3A8A);border-radius:12px;padding:14px 16px;margin-bottom:20px;text-align:center}
.pin-format-label{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.pin-format-value{font-size:1.3rem;font-weight:900;color:#C9A84C;letter-spacing:0.1em}
.pin-format-desc{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px}

.footer-links{margin-top:20px;text-align:center;font-size:12px;color:rgba(255,255,255,0.4)}
.footer-links a{color:#C9A84C;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <img src="/icon-192.png" alt="Travex"/>
    <span class="brand">travex <span>mall</span></span>
  </div>

  <h1>Karibu Tena 👋</h1>
  <p class="sub">Ingiza PIN yako kuingia kwenye dashboard ya duka lako</p>

  <!-- PIN Format Guide -->
  <div class="pin-format">
    <div class="pin-format-label">Muundo wa PIN Yako</div>
    <div class="pin-format-value">XXXX — 0XX</div>
    <div class="pin-format-desc">PIN yako (namba 4) + dash + namba ya duka lako</div>
  </div>

  <!-- Error / Success -->
  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <!-- Login Form -->
  <div class="form-group">
    <label>PIN YAKO</label>
    <input
      type="text"
      id="pinInput"
      placeholder="mfano: 8842-048"
      maxlength="8"
      autocomplete="off"
      oninput="formatPin(this)"
      onkeydown="if(event.key==='Enter')doLogin()"
    />
    <div class="hint">PIN uliyopewa kupitia WhatsApp baada ya kuidhinishwa</div>
  </div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">
    🔐 Ingia Dashboard
  </button>

  <div class="divider">au</div>

  <button class="btn-reset" onclick="window.location.href='reset-pin.html'">
    🔄 Nimesahau PIN — Reset hapa
  </button>
</div>

<div class="footer-links">
  <a href="/">← Rudi ShopNekt</a> &nbsp;·&nbsp;
  <a href="/open-store">Fungua Duka Jipya</a>
</div>

<script>
const SB_URL = 'https://bscecjbgnjitlfmgwcic.supabase.co'
const SB_KEY = 'sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos'

// Auto-format PIN as user types: 8842 → 8842-048
function formatPin(input) {
  let val = input.value.replace(/[^0-9]/g,'')
  if (val.length > 4) {
    val = val.slice(0,4) + '-' + val.slice(4,7)
  }
  input.value = val
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('successBox').style.display = 'none'
}
function showSuccess(msg) {
  const el = document.getElementById('successBox')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('errorBox').style.display = 'none'
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim()

  // Validate format: XXXX-XXX
  if (!/^\d{4}-\d{3}$/.test(pin)) {
    showError('Muundo wa PIN si sahihi. Mfano: 8842-048')
    return
  }

  const [sellerPin, shopNum] = pin.split('-')
  const btn = document.getElementById('loginBtn')
  btn.textContent = 'Inaingia...'
  btn.disabled = true
  document.getElementById('errorBox').style.display = 'none'

  try {
    // Find shop by shop_number and verify PIN
    const res = await fetch(`${SB_URL}/rest/v1/pending_payments?shop_number=eq.${shopNum}&select=id,shop_name,owner_name,owner_phone,status,plan,seller_pin,shop_number`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    })
    const data = await res.json()

    if (!data || !data.length) {
      showError('Duka halikupatikana. Angalia PIN yako tena.')
      btn.textContent = '🔐 Ingia Dashboard'; btn.disabled = false
      return
    }

    const shop = data[0]

    if (shop.status !== 'approved') {
      showError('Duka lako bado halijaidhinishwa. Wasiliana na ShopNekt.')
      btn.textContent = '🔐 Ingia Dashboard'; btn.disabled = false
      return
    }

    // Verify PIN
    if (shop.seller_pin !== sellerPin) {
      showError('PIN si sahihi. Jaribu tena au reset PIN yako.')
      btn.textContent = '🔐 Ingia Dashboard'; btn.disabled = false
      return
    }

    // ✅ Login success — save session
    const session = {
      id: shop.id,
      shop_name: shop.shop_name,
      owner_name: shop.owner_name,
      owner_phone: shop.owner_phone,
      plan: shop.plan,
      shop_number: shop.shop_number,
      logged_in_at: new Date().toISOString()
    }
    localStorage.setItem('travex_session', JSON.stringify(session))

    showSuccess(`✅ Karibu ${shop.shop_name}! Unaingia...`)
    setTimeout(() => { window.location.href = 'dashboard.html' }, 1000)

  } catch(e) {
    showError('Hitilafu imetokea. Angalia internet yako na ujaribu tena.')
    btn.textContent = '🔐 Ingia Dashboard'; btn.disabled = false
  }
}

// Check if already logged in
const existing = JSON.parse(localStorage.getItem('travex_session') || '{}')
if (existing?.id) {
  window.location.href = 'dashboard.html'
}
</script>
</body>
</html>
