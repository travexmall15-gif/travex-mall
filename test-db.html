<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DB Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem;font-size:14px}
.ok{color:#4ade80;font-weight:bold}
.err{color:#f87171;font-weight:bold}
.warn{color:#fbbf24}
pre{background:rgba(0,0,0,0.5);padding:1rem;margin:0.5rem 0;white-space:pre-wrap;word-break:break-all;border-left:3px solid #C9A84C}
</style>
</head>
<body>
<h2 style="color:#C9A84C">🔍 Live Database Test</h2>
<div id="out">Running...</div>
<script>
const SB_URL = "https://bscecjbgnjitlfmgwcic.supabase.co";
const SB_KEY = "sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos";
const {createClient} = supabase;
const sb = createClient(SB_URL, SB_KEY);
const out = document.getElementById('out');

function log(msg, cls='') {
  out.innerHTML += `<div class="${cls}">${msg}</div>`;
}
function pre(obj) {
  out.innerHTML += `<pre>${JSON.stringify(obj, null, 2)}</pre>`;
}

async function run() {
  out.innerHTML = '';

  // TEST 1: campus_applications
  log('--- TEST 1: READ campus_applications ---');
  const {data:a, error:ae, count:ac} = await sb
    .from('campus_applications')
    .select('*', {count:'exact'})
    .order('created_at', {ascending:false});
  
  if (ae) {
    log('❌ ERROR: ' + ae.message, 'err');
    log('Code: ' + ae.code, 'err');
    log('Hint: ' + ae.hint, 'warn');
    log('Details: ' + ae.details, 'warn');
  } else {
    log(`✅ SUCCESS — ${ac} records found`, 'ok');
    if (a.length > 0) {
      log('Records:');
      pre(a.map(x => ({id:x.id, name:x.full_name, shop:x.shop_name, status:x.status, date:x.created_at})));
    } else {
      log('⚠️ Table is EMPTY — no applications submitted yet', 'warn');
    }
  }

  // TEST 2: campus_stores
  log('');
  log('--- TEST 2: READ campus_stores ---');
  const {data:s, error:se} = await sb
    .from('campus_stores')
    .select('id, store_name, university_abbr, is_active')
    .limit(5);
  
  if (se) {
    log('❌ ERROR: ' + se.message, 'err');
    log('Code: ' + se.code, 'err');
  } else {
    log(`✅ SUCCESS — ${s.length} stores`, 'ok');
    if (s.length) pre(s);
  }

  // TEST 3: admin_notifications
  log('');
  log('--- TEST 3: READ admin_notifications ---');
  const {data:n, error:ne} = await sb
    .from('admin_notifications')
    .select('id, title, type, is_read, created_at')
    .order('created_at', {ascending:false})
    .limit(5);
  
  if (ne) {
    log('❌ ERROR: ' + ne.message, 'err');
    log('Code: ' + ne.code, 'err');
  } else {
    log(`✅ SUCCESS — ${n.length} notifications`, 'ok');
    if (n.length) pre(n);
  }

  // TEST 4: INSERT a test application
  log('');
  log('--- TEST 4: INSERT test application ---');
  const {data:ins, error:inse} = await sb
    .from('campus_applications')
    .insert({
      full_name: 'LIVE TEST ' + new Date().toLocaleTimeString(),
      email: 'livetest_' + Date.now() + '@test.com',
      phone: '+255700000001',
      whatsapp_number: '+255700000001',
      university_name: 'Ardhi University',
      university_abbr: 'ARU',
      region: 'Dar es Salaam',
      year_of_study: '2',
      shop_name: 'Live Test Shop',
      category: 'Other',
      description: 'Live test - delete me',
      status: 'pending',
      submitted_at: new Date().toISOString()
    })
    .select();

  if (inse) {
    log('❌ INSERT FAILED: ' + inse.message, 'err');
    log('Code: ' + inse.code, 'err');
    log('Details: ' + inse.details, 'warn');
    log('Hint: ' + inse.hint, 'warn');
  } else {
    log('✅ INSERT SUCCESS! ID: ' + ins[0]?.id, 'ok');
    pre(ins[0]);
    
    // Now read it back
    log('');
    log('--- TEST 5: READ BACK inserted record ---');
    const {data:rb, error:rbe} = await sb
      .from('campus_applications')
      .select('*')
      .eq('id', ins[0].id)
      .single();
    
    if (rbe) {
      log('❌ READ BACK FAILED: ' + rbe.message, 'err');
      log('⚠️ This means INSERT works but SELECT is blocked!', 'warn');
    } else {
      log('✅ READ BACK SUCCESS!', 'ok');
      pre(rb);
    }
  }

  log('');
  log('=== DONE ===', 'ok');
}

run();
</script>
</body>
</html>
