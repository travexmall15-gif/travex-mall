<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Travex Mall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D1B3E;--gold:#C9A84C;--gold2:#F0C96B;--white:#fff;--offwhite:#F8F9FC;--gray:#6B7280;--lgray:#E5E7EB;--dark:#111827;--red:#DC2626;--green:#059669}
body{font-family:'Inter',sans-serif;background:var(--offwhite);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--navy);padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.2rem;font-weight:800;color:var(--white);text-decoration:none}
.nav-logo span{color:var(--gold)}
.nav-back{font-size:0.8rem;color:rgba(255,255,255,0.6);text-decoration:none}
.nav-back:hover{color:var(--gold)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.card{background:var(--white);width:100%;max-width:460px;padding:2.5rem;box-shadow:0 4px 24px rgba(13,27,62,0.08);border:1px solid var(--lgray)}
.logo-area{text-align:center;margin-bottom:1.8rem}
.logo-text{font-size:1.4rem;font-weight:800;color:var(--navy)}
.logo-text span{color:var(--gold)}
.logo-sub{font-size:0.8rem;color:var(--gray);margin-top:0.3rem}
.card-title{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:0.3rem}
.card-sub{font-size:0.875rem;color:var(--gray);margin-bottom:1.5rem}
.alert{padding:0.75rem 1rem;font-size:0.85rem;font-weight:500;margin-bottom:1rem;display:none}
.alert-error{background:#FEE2E2;border:1px solid #FECACA;color:var(--red)}
.alert-success{background:#D1FAE5;border:1px solid #A7F3D0;color:var(--green)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:0.8rem;font-weight:600;color:var(--dark);margin-bottom:0.45rem}
.form-input{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--lgray);font-family:'Inter',sans-serif;font-size:0.875rem;color:var(--dark);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--navy)}
.form-input::placeholder{color:#9CA3AF}
.form-select{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--lgray);font-family:'Inter',sans-serif;font-size:0.875rem;color:var(--dark);outline:none;background:var(--white);cursor:pointer}
.form-select:focus{border-color:var(--navy)}
.btn-submit{width:100%;padding:0.85rem;background:var(--navy);color:var(--white);border:none;font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:1rem}
.btn-submit:hover{background:#1B3A6B}
.btn-submit:disabled{background:var(--lgray);color:var(--gray);cursor:not-allowed}
.switch-text{text-align:center;font-size:0.875rem;color:var(--gray)}
.switch-text a{color:var(--navy);font-weight:700;text-decoration:none}
.success-screen{display:none;text-align:center;padding:1rem 0}
.success-icon{font-size:3.5rem;margin-bottom:1rem}
.success-title{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:0.5rem}
.success-sub{font-size:0.875rem;color:var(--gray);line-height:1.6;margin-bottom:1.5rem}
.btn-go{display:block;padding:0.85rem;background:var(--gold);color:var(--navy);font-weight:700;font-size:0.9rem;text-align:center;text-decoration:none;transition:all 0.2s}
.btn-go:hover{background:var(--gold2)}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">TRAVEX <span>MALL</span></a>
  <a href="index.html" class="nav-back">← Back to Home</a>
</nav>
<main>
  <div class="card">
    <div class="logo-area">
      <div class="logo-text">TRAVEX <span>MALL</span></div>
      <div class="logo-sub">Create your free account</div>
    </div>

    <div id="signupForm">
      <div class="card-title">Create Account</div>
      <div class="card-sub">Start selling online in minutes</div>
      <div class="alert alert-error" id="errorMsg"></div>
      <div class="alert alert-success" id="successMsg"></div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-input" id="fullName" placeholder="Jumanne Maregeri">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" class="form-input" id="phone" placeholder="+255 712 000 000">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" class="form-input" id="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label class="form-label">Business Category</label>
        <select class="form-select" id="category">
          <option value="">Select category (optional)</option>
          <option>Fashion & Clothing</option>
          <option>Electronics</option>
          <option>Food & Agriculture</option>
          <option>Beorty & Health</option>
          <option>Hardware & Construction</option>
          <option>Home & Furniture</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" class="form-input" id="password" placeholder="Minimum 6 characters">
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="Repeat password">
      </div>

      <button class="btn-submit" id="signupBtn" onclick="handleSignup()">Create My Account</button>
      <div class="switch-text">Already have an account? <a href="login.html">Log in here</a></div>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="success-icon">📧</div>
      <div class="success-title">Check Your Email!</div>
      <div class="success-sub">
        We sent a confirmation link to your email address.<br>
        Click the link to verify your account,<br>
        then come back to log in.
      </div>
      <a href="login.html" class="btn-go">Go to Login →</a>
    </div>
  </div>
</main>

<script>
  // ── REPLACE THESE WITH YOUR REAL VALUES ──
  const SUPABASE_URL = 'https://bscecjbgnjitlfmgwcic.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos';
  // ─────────────────────────────────────────

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }

  async function handleSignup() {
    const name     = document.getElementById('fullName').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const email    = document.getElementById('email').value.trim();
    const category = document.getElementById('category').value;
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirmPassword').value;
    const btn      = document.getElementById('signupBtn');

    if (!name || !phone || !email || !password) { showError('Please fill in all required fields.'); return; }
    if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
    if (password !== confirm) { showError('Passwords do not match.'); return; }

    btn.textContent = 'Creating account...';
    btn.disabled = true;

    const { data, error } = await sb.orth.signUp({
      email, password,
      options: {
        data: { name, phone, category },
        emailRedirectTo: window.location.origin + '/login.html'
      }
    });

    if (error) {
      showError(error.message);
      btn.textContent = 'Create My Account';
      btn.disabled = false;
      return;
    }

    if (data.user) {
      await sb.from('profiles').upsert({ id: data.user.id, name, phone });
    }

    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('successScreen').style.display = 'block';
  }

  document.addEventListener('keypress', e => { if (e.key === 'Enter') handleSignup(); });
</script>
</body>
</html>
