<!DOCTYPE html>
<html>
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body style="font-family:monospace;background:#0D1B3E;color:#fff;padding:2rem">
<h2 style="color:#C9A84C">Creating Stores from Approved Applications</h2>
<div id="out"></div>
<script>
const sb = supabase.createClient(
  "https://bscecjbgnjitlfmgwcic.supabase.co",
  "sb_publishable_giz1AS9CcdTiksOrW5U0rQ_yY5kkzos"
);
const out = document.getElementById('out');
function log(m,c='#fff'){out.innerHTML+=`<div style="color:${c};margin:3px 0">${m}</div>`;}

async function run(){
  // Get all approved applications
  const {data:apps, error:ae} = await sb.from('campus_applications')
    .select('*').eq('status','approved');
  
  if(ae){ log('❌ Cannot read applications: '+ae.message,'#f87171'); return; }
  log(`Found ${apps.length} approved applications`,'#4ade80');
  log('Creating stores...','#fbbf24');

  let created = 0, failed = 0;

  for(const app of apps){
    const slug = app.full_name.toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-|-$/g,'')
      + '-' + app.university_abbr.toLowerCase()
      + '-' + Date.now() + Math.floor(Math.random()*1000);

    const store = {
      store_name:      app.full_name + "'s Shop",
      slug:            slug,
      university:      app.university || app.university_abbr,
      university_abbr: app.university_abbr,
      category:        app.business_category || 'General',
      description:     app.business_description || '',
      whatsapp_number: app.whatsapp_number || app.phone || '',
      is_active:       true
    };

    const {data, error} = await sb.from('campus_stores').insert(store).select();
    if(error){
      log(`❌ FAILED ${app.full_name}: ${error.message}`,'#f87171');
      failed++;
    } else {
      log(`✅ Created: "${store.store_name}" | ${store.university_abbr} | ID: ${data[0]?.id}`,'#4ade80');
      created++;
    }
    // Small delay to avoid slug collisions
    await new Promise(r => setTimeout(r, 50));
  }

  log(`\n=== DONE: ${created} created, ${failed} failed ===`,'#C9A84C');
  
  if(created > 0){
    log('\n✅ Stores are now live!','#4ade80');
    log('Visit campus-university.html?uni=ARU to see ARU stores','#4ade80');
    log('Visit campus-university.html?uni=UDSM to see UDSM stores','#4ade80');
    log('Visit campus-university.html?uni=UDOM to see UDOM stores','#4ade80');
    out.innerHTML += `
      <div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:0.5rem">
        <a href="campus-university.html?uni=ARU" target="_blank" style="color:#C9A84C;font-weight:700">→ View ARU Marketplace</a>
        <a href="campus-university.html?uni=UDSM" target="_blank" style="color:#C9A84C;font-weight:700">→ View UDSM Marketplace</a>
        <a href="campus-university.html?uni=UDOM" target="_blank" style="color:#C9A84C;font-weight:700">→ View UDOM Marketplace</a>
        <a href="admin-panel.html" target="_blank" style="color:#C9A84C;font-weight:700">→ Open Admin Panel</a>
      </div>`;
  }
}
run();
</script>
</body>
</html>
